<style>

 --acc:#5B3A7A;--acc2:#7C55A0;--bg1:#F8F3EC;--bg2:#ECE4F3;--tx:#1F1B24;--mut:#6B6474;--card:#FFFFFF;--line:#E3DCEA;
 --big:#1F5C99;--bigbg:#DCE9F7;--small:#8A5A00;--smallbg:#FBEBC8;--shadow:0 1px 2px rgba(60,30,90,.08),0 6px 18px rgba(60,30,90,.07);
 --colbg:rgba(255,255,255,.62);--onacc:#fff;--lau:#8A3F9B;--josh:#35505F;--both:#9A6B1C;
 --head:"Fraunces",Georgia,serif;
}

 --acc:#C9A7E8;--acc2:#B48BDB;--bg1:#17141C;--bg2:#1E1826;--tx:#F0ECF4;--mut:#A79FB2;--card:#252030;--line:#3A3346;
 --big:#8DBBEB;--bigbg:#1E3248;--small:#E8B75A;--smallbg:#3D3118;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
 --colbg:rgba(255,255,255,.04);--onacc:#17141C;--lau:#D79BE6;--josh:#9CC0D6;--both:#E3B36A}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
body{margin:0;color:var(--tx);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;padding:0 16px 48px;max-width:1500px;margin:0 auto;overflow-x:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{min-height:44px;padding:8px 16px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
button:hover{box-shadow:var(--shadow)}button:active{transform:scale(.98)}
button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 8px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--acc);display:grid;grid-template-columns:repeat(2,9px);grid-template-rows:repeat(3,9px);gap:5px;place-content:center;box-shadow:var(--shadow)}
.logo i{background:var(--onacc);border-radius:50%}
.brand h1{font:700 1.7rem/1.1 var(--head);margin:0;color:var(--acc)}
.brand div{color:var(--mut);font-size:.95rem}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who .lbl{color:var(--mut);font-size:.9rem}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:.9rem;color:#fff;flex:none}
.av.p0{background:var(--lau)}.av.p1{background:var(--josh)}.av.p2{background:var(--both)}
@media (prefers-color-scheme:dark){.av{color:#17141C}}
.pick{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px}
.tabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.tabs button{border-radius:999px;padding:8px 20px}
.status{font-size:.82rem;color:var(--mut);margin:0 0 8px;min-height:1.2em}
/* layout */
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}.wrap>div{min-width:0}
@media (min-width:1000px){.wrap{grid-template-columns:310px minmax(0,1fr);align-items:start}.wrap>div:first-child{position:sticky;top:12px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.panel h2{font:700 1.25rem var(--head);margin:0 0 4px}
.sub{color:var(--mut);font-size:.92rem;margin:0 0 12px}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.area{min-height:62px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.82rem;border-radius:14px;background:var(--ac,#eee);border:2px solid transparent;color:#1F1B24}
.area .em{font-size:1.4rem;line-height:1}
.area.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
@media (prefers-color-scheme:dark){.area{background:var(--acd,#333);color:#F0ECF4}}
.prompt{border-radius:18px;padding:16px;background:var(--ac,#eee);color:#1F1B24;margin-bottom:12px}
@media (prefers-color-scheme:dark){.prompt{background:var(--acd,#333);color:#F0ECF4}}
.prompt small{opacity:.75;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;font-weight:700}
.prompt p{font:500 1.2rem/1.3 var(--head);margin:6px 0 10px}
.prompt button{min-height:38px;padding:4px 14px;background:rgba(255,255,255,.7);color:#1F1B24}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--card)}
.add input:focus{border-color:var(--acc)}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;min-height:40px;padding:4px 10px}
.seg .bigb.on{background:var(--big);border-color:var(--big);color:#fff}.seg .smallb.on{background:var(--small);border-color:var(--small);color:#fff}
@media (prefers-color-scheme:dark){.seg .bigb.on,.seg .smallb.on{color:#17141C}}
details.paste{margin-top:10px}details.paste summary{cursor:pointer;color:var(--acc);font-weight:700;min-height:32px}
textarea{width:100%;min-height:120px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px}
@media (max-width:700px){.board{grid-auto-columns:86%}}
.col{scroll-snap-align:start;background:var(--colbg);border:1px solid var(--line);border-radius:20px;padding:12px;min-height:260px;transition:background .15s,border-color .15s}
.col.ideas{border-style:dashed}
.col.over{background:var(--bigbg);border-color:var(--acc)}
.ch{display:flex;align-items:center;gap:10px;margin:2px 4px 10px}
.ch h3{font:700 1.1rem var(--head);margin:0}
.ch .cnt{color:var(--mut);font-size:.82rem}
.ch .avx{font-size:1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--small);border-radius:14px;padding:10px 12px;margin:0 0 10px;box-shadow:var(--shadow);cursor:grab;position:relative}.card.fresh{animation:pop .25s}
.card.big{border-left-color:var(--big)}
.card.done{opacity:.6}.card.done .ctext{text-decoration:line-through}
.card.dragging{opacity:.4}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;top:6px;right:6px;min-height:30px;min-width:30px;padding:0;border:0;background:none;color:var(--mut);font-size:1.1rem;border-radius:50%}.x:hover{background:var(--bg2);box-shadow:none}.ctop{padding-right:26px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.chip{font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--bg2);color:var(--mut)}
.pill{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;border:0;min-height:26px;cursor:pointer}
.pill.big{background:var(--bigbg);color:var(--big)}.pill.small{background:var(--smallbg);color:var(--small)}
.ctext{font-size:1.02rem;word-break:break-word;min-height:24px}
.ctext[contenteditable=true]{background:var(--bg2);border-radius:8px;padding:2px 6px}
.subs{margin:8px 0 2px;padding-left:2px}
.sr{display:flex;gap:8px;align-items:center;font-size:.95rem;padding:3px 0}
.sr input{width:20px;height:20px;flex:none}
.sr.done span{text-decoration:line-through;color:var(--mut)}
.sr button{min-height:28px;padding:0 8px;margin-left:auto;border:0;background:none;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:var(--bg2);margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--big)}
.cf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cf .mini{min-height:34px;padding:2px 10px;font-size:.85rem}.tk{width:22px;height:22px;margin:0 2px 0 0;flex:none;cursor:pointer}
.give{display:flex;gap:4px;align-items:center;margin-right:auto}
.give button{min-height:30px;min-width:30px;width:30px;height:30px;font-size:.82rem;padding:0;border-radius:50%;border:0;display:grid;place-items:center}
.give .gi{width:auto!important;border-radius:999px;padding:0 8px;font-size:.8rem;background:var(--bg2)}
.brk input{width:100%;min-height:40px;border:2px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--card);margin-top:6px}
.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:14px;font-size:.92rem}
.balance{margin:0 0 14px;padding:12px 16px}
.bal{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg2);margin:8px 0}
.bal i{display:block}.bal .b0{background:var(--lau)}.bal .b1{background:var(--josh)}.bal .b2{background:var(--both)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.note{background:var(--bigbg);border-radius:14px;padding:12px 14px;margin:10px 0}
.code{font:700 1.8rem var(--head);letter-spacing:.12em;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.day{max-width:640px;margin:auto}.day h2{font:700 1.5rem var(--head)}
input[type=text]{min-height:44px;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.steps{list-style:none;display:flex;gap:8px;flex-wrap:wrap;padding:0;margin:0 0 16px;counter-reset:s}
.steps button{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 16px 6px 6px}
.steps .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--bg2);font-weight:700}
.steps button.on .num{background:var(--onacc);color:var(--acc)}
.steps button.past{color:var(--mut)}
.welcome{background:linear-gradient(135deg,var(--card),var(--bigbg));border:1px solid var(--line);border-radius:24px;padding:22px 26px;margin:0 0 18px;box-shadow:var(--shadow)}
.welcome h2{font:700 1.6rem var(--head);margin:0 0 8px;color:var(--acc)}
.welcome p{max-width:70ch;margin:0 0 10px}
.bwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.bwrap>div{min-width:0}
@media (min-width:1000px){.bwrap{grid-template-columns:420px minmax(0,1fr);align-items:start}.stagecol{position:sticky;top:12px}}
.stage{border-radius:24px;padding:22px;background:var(--ac);color:#1F1B24;box-shadow:var(--shadow);margin-bottom:14px}

.stage small{text-transform:uppercase;letter-spacing:.07em;font-size:.74rem;font-weight:700;opacity:.75}
.stage .q{font:600 1.75rem/1.2 var(--head);margin:8px 0 12px}
.hints{margin:0 0 14px;padding-left:20px;font-size:1rem}.hints li{margin:3px 0}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.stage .srow button{background:rgba(255,255,255,.75);color:#1F1B24;border-color:transparent}
.stage .srow button.on{background:var(--acc);color:#fff}
.tmr{font-variant-numeric:tabular-nums}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.sl{font-size:.85rem;color:inherit;opacity:.8;margin-right:4px}
.chipb{min-height:34px;padding:2px 12px;border-radius:999px;font-size:.88rem;background:rgba(255,255,255,.6);border:1px dashed rgba(0,0,0,.25);color:#1F1B24}
.add.big input{font-size:1.15rem;min-height:56px}
.seg .sl{color:var(--mut);align-self:center}
.wallhead{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}.wallhead h2{font:700 1.4rem var(--head);margin:0}
.grp{margin:0 0 18px}.grp h3{font:700 1.05rem var(--head);margin:0 0 8px}.grp .cnt{color:var(--mut);font:400 .85rem "Atkinson Hyperlegible",sans-serif}
.notes{display:flex;flex-wrap:wrap;gap:12px}
.note{position:relative;width:210px;min-height:120px;padding:10px 12px 8px;border-radius:4px 4px 16px 4px;background:var(--ac);color:#1F1B24;box-shadow:0 2px 3px rgba(40,20,60,.12),0 8px 18px rgba(40,20,60,.1);transform:rotate(var(--rot,0deg));cursor:grab;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.note:hover{transform:rotate(0) translateY(-2px)}
.note.big{border-top:5px solid var(--big);width:240px}
.note.small{border-top:5px solid var(--small)}
.note.over{outline:3px dashed var(--acc);outline-offset:3px;transform:scale(1.03)}
.note.dragging{opacity:.4}
@media (prefers-color-scheme:dark){.note{background:var(--acd);color:#F0ECF4}}
.ntop{display:flex;gap:6px;align-items:center;padding-right:24px;margin-bottom:6px}
.ntag{font-size:.72rem;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.6);color:#1F1B24}
.note .ctext{font-size:1rem;flex:1}
.nsubs{font-size:.88rem;margin:6px 0;padding:6px 8px;background:rgba(255,255,255,.45);border-radius:8px}
@media (prefers-color-scheme:dark){.nsubs{background:rgba(0,0,0,.2)}.ntag{background:rgba(0,0,0,.25);color:#F0ECF4}}
.ns{display:flex;gap:6px;align-items:center}.ns span{flex:1}.ns button{min-height:26px;padding:0 6px;border:0;background:none;color:inherit;opacity:.7}
.nfoot{display:flex;justify-content:space-between;margin-top:6px}
.lnk{min-height:30px;padding:0 6px;border:0;background:none;color:inherit;opacity:.75;font-size:.85rem;text-decoration:underline}
.nnpile{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.nnpile summary{cursor:pointer;font-weight:700;min-height:30px}
.intro h2{font:700 1.6rem var(--head);margin:0 0 4px}
.tilebox{margin:0}.area{position:relative}.tb{position:absolute;top:4px;right:6px;font-size:.72rem;font-weight:700;background:var(--acc);color:var(--onacc);border-radius:999px;padding:0 6px}.parts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}.parts button{min-height:32px;padding:2px 12px;border-radius:999px;font-size:.85rem;background:rgba(255,255,255,.55);border-color:transparent;color:#1F1B24}.parts button.on{background:#fff;font-weight:700;box-shadow:0 0 0 2px var(--acc)}.parts button.past{opacity:.6}.area.addcat{background:transparent;border:2px dashed var(--line);color:var(--mut)}.pnote{font-size:.88rem;margin:0 0 10px;opacity:.85}.wallact{margin-left:auto;display:flex;gap:8px;align-items:center}.wallact .lnk{color:var(--mut)}.tgh{font-weight:700;font-size:.85rem;color:var(--mut);margin:10px 0 6px}.tlead{color:var(--mut);margin:0 0 6px}.stage.open .sl{opacity:.8;font-weight:700;font-size:.85rem}.note2{background:var(--bigbg);border-radius:14px;padding:12px 14px;margin:10px 0}
.give .sel{outline:3px solid var(--acc2);outline-offset:1px}
.m{color:var(--mut)}
</style>

 h+='<div class="cf"><div class="give">'+[0,1,2].map(function(i){return '<button class="av p'+i+(t.to===i?' sel':'')+'" data-act="give" data-id="'+t.id+'" data-i="'+i+'" aria-label="Give to '+who(i)+'" title="'+who(i)+'">'+(i===2?'+':NAMES[i].charAt(0))+'</button>';}).join('')+(t.to!==null&&t.to!==undefined?'<button class="gi" data-act="give" data-id="'+t.id+'" data-i="" title="Back to still to share out">↩</button>':'')+'</div><button class="mini" data-act="brk" data-id="'+t.id+'">'+(ui.open[t.id]?'Done':'+ Step')+'</button></div></article>';
 return h;
}
function column(to,title,sub,ico){
 var ts=live().filter(function(t){return (t.to===undefined?null:t.to)===to&&!t.done;});
 var dn=live().filter(function(t){return (t.to===undefined?null:t.to)===to&&t.done;}).length;
 var big=ts.filter(function(t){return t.size==='big';}).length;
 var h='<section class="col'+(to===null?' ideas':'')+'" data-to="'+(to===null?'':to)+'"><div class="ch">'+ico+'<div><h3>'+esc(title)+'</h3><div class="cnt">'+(ts.length?big+' big · '+(ts.length-big)+' small':sub)+(dn?' · '+dn+' done':'')+'</div></div></div>';
 if(!ts.length)h+='<div class="empty">'+(to===null?'Everything has been shared out.':'Drag a card here, or tap the round buttons on a card.')+'</div>';
 ts.forEach(function(t){h+=card(t);});
 return h+'</section>';
}
function balance(){
 var c=[0,1,2].map(function(i){return live().filter(function(t){return t.to===i&&!t.done;});});
 var tot=c[0].length+c[1].length+c[2].length,un=live().filter(function(t){return (t.to===null||t.to===undefined)&&!t.done;}).length;
 var bg=c.map(function(a){return a.filter(function(t){return t.size==='big';}).length;});
 var h='<div class="panel balance"><div class="legend">'+[0,1,2].map(function(i){return '<span>'+av(i,22)+' <b>'+who(i)+'</b> '+c[i].length+' <span class="m">('+bg[i]+' big)</span></span>';}).join('')+'<span class="m">Still to share out: '+un+'</span></div>';
 if(tot)h+='<div class="bal" aria-hidden="true">'+[0,1,2].map(function(i){return '<i class="b'+i+'" style="width:'+(c[i].length/tot*100)+'%"></i>';}).join('')+'</div>';
 var msg=Math.abs(bg[0]-bg[1])>=2?(bg[0]>bg[1]?NAMES[0]:NAMES[1])+' is holding more of the big ones. Worth a look together.':(un?'Some are still to share out.':tot?'Everything has a home. Each person’s tasks go to Get a grip on their phone.':'');
 return h+(msg?'<div class="sub" style="margin:0">'+esc(msg)+'</div>':'')+'</div>';
}
function alloc(){
 return '<div class="intro"><h2>Share out</h2><p class="sub">Drag each card to whoever will own it from start to finish: noticing it, planning it and doing it. “Both” is for things you will split up later.</p></div>'+balance()+'<div class="board">'
  +column(null,'Still to share out','From the wall','<span class="avx">🗂️</span>')+column(0,NAMES[0],'Nothing yet',av(0,38))+column(1,NAMES[1],'Nothing yet',av(1,38))+column(2,'Both','To split up between you',av(2,38))+'</div>';
}

/* ---- my day and sharing ---- */
function pickDay(me){
 var open=live().filter(function(t){return !t.done&&t.to===me;});
 var big=open.filter(function(t){return t.size==='big';})[0],ids=[];
 if(big){var nk=kids(big.id).filter(function(k){return !k.done;}).slice(0,2);ids=nk.length?nk.map(function(k){return k.id;}):[big.id];}
 return {big:ids,small:open.filter(function(t){return t.size!=='big';}).slice(0,3).map(function(t){return t.id;}),u:now()};
}
function row(t,big){var p=t.parent?byId(t.parent):null;return '<div class="card '+(big?'big':'small')+(t.done?' done':'')+'" style="cursor:default"><div class="sr"><input type="checkbox" data-act="tick" data-id="'+t.id+'" aria-label="Done"'+(t.done?' checked':'')+' style="width:26px;height:26px"><div><span class="pill '+(big?'big':'small')+'">'+(big?'Big':'Small')+'</span>'+(p?'<div class="chip" style="margin:2px 0">'+esc(p.text)+'</div>':'')+'<div class="ctext">'+esc(t.text)+'</div></div></div></div>';}
function day(){
 var me=L.me,d=D.day[today()+':'+me],h='<div class="day"><h2>'+esc(NAMES[me])+'’s day</h2>';
 if(!d)return h+'<div class="note2">A preview of what will arrive in Get a grip: one big thing and up to three small things from what '+esc(NAMES[me])+' owns. Nothing else is shown, so it never looks like a mountain.</div><div class="srow"><button class="on" data-act="plan">Plan my day</button></div></div>';
 var all=d.big.concat(d.small).map(byId).filter(Boolean),dn=all.filter(function(t){return t.done;}).length;
 h+='<p class="sub">'+dn+' of '+all.length+' done</p>';all.forEach(function(t){h+=row(t,d.big.indexOf(t.id)>=0);});
 if(all.length&&dn===all.length)h+='<div class="note2">That is today done. Anything else is a bonus.</div>';
 return h+'<div class="srow"><button data-act="more">Bring in one more</button><button data-act="replan">Start the day again</button></div></div>';
}
function link(){
 var h='<div class="day"><h2>Sharing</h2>';
 if(L.code)return h+'<div class="note2">This device shares a household. The code is<div class="code">'+showCode(L.code)+'</div>On each other device open this page, go to Sharing and choose “Join with a code”.</div><div class="srow"><button data-act="syncnow">Update now</button><button data-act="leave">Stop sharing on this device</button></div></div>';
 return h+'<div class="note2">Lauren and Josh share one household. One of you starts it and gets a code; the other devices join with that code. You do this once per device.</div><div class="srow"><button class="on" data-act="start">Start a new household</button></div><div class="srow"><input type="text" id="jc" placeholder="Code, for example K7QD-4XMB-92TH" autocapitalize="characters" size="26"><button data-act="join">Join with a code</button></div><div class="srow"><button data-act="locally">Just try it on this device</button></div></div>';
}
function head(){
 var h='<header class="top"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="brand"><h1>Get a Grip Household</h1><div>Work it out together. Do a little each day.</div></div><div class="who"><span class="lbl">This device is</span>';
 [0,1].forEach(function(i){h+='<button class="pick'+(L.me===i?' on':'')+'" data-act="me" data-i="'+i+'">'+av(i,26)+esc(NAMES[i])+'</button>';});
 h+='</div></header><nav class="tabs">'+[['brain','1 · Brainstorm'],['alloc','2 · Share out'],['day','My day'],['link','Sharing']].map(function(x){return '<button class="'+(L.tab===x[0]?'on':'')+'" data-act="tab" data-t="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</nav><div class="status" id="st">'+esc(ui.status)+'</div>';
 return h;
}
function typing(){var a=document.activeElement;return a&&(a.id==='qa'||a.hasAttribute('data-brk')||a.isContentEditable);}
function draw(force){
 if(!force&&typing()){ui.defer=true;return;}
 ui.defer=false;
 var a=document.getElementById('app'),q=document.getElementById('qa'),qv=q?q.value:'',bs=document.querySelector('.board'),sx=bs?bs.scrollLeft:0,nn=document.querySelector('.nnpile'),nno=nn&&nn.open;
 if(SERVER&&!L.code&&!L.local)L.tab='link';
 a.innerHTML=head()+(L.tab==='brain'?brain():L.tab==='alloc'?alloc():L.tab==='day'?day():link());
 var q2=document.getElementById('qa');if(q2)q2.value=qv;var b2=document.querySelector('.board');if(b2)b2.scrollLeft=sx;var n2=document.querySelector('.nnpile');if(n2&&nno)n2.open=true;
 ui.fresh=null;tick();
}
function tick(){var el=document.getElementById('tleft');if(!el)return;var s=Math.max(0,Math.round((ui.timer-Date.now())/1000));el.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);if(s===0){ui.timer=0;draw();}}
setInterval(tick,1000);
var EXT=['Company website: finish the build and the SEO','Phone app for sale: first working version','Redo the bathroom','Pay the house insurance','Compare energy tariffs','Fix the dripping kitchen tap','Book the boiler service','Clear the gutters','Book the dentist','Renew the car tax','Check passport expiry dates','Update the wills','Job applications: send three this week','Pay the house insurance (every year, must happen)','Fix the leaking kitchen tap','Order the dog food','Call the dentist','Sort passports for the summer','House: redo the bathroom','Phone app for sale: get the first version working','Company website: finish the build and the SEO'];
function isEx(t){return t.ex||(!t.parent&&EXT.indexOf(t.text)>=0);}
function exList(){return D.tasks.filter(function(t){return isEx(t)||(t.parent&&byId(t.parent)&&isEx(byId(t.parent)));});}
function removeAll(list){list.forEach(function(x){D.gone.push({id:x.id,at:now()});});D.tasks=D.tasks.filter(function(x){return list.indexOf(x)<0;});changed();}
function example(){
 var ex=[['Company website: finish the build and the SEO','big','business',''],['Phone app for sale: first working version','big','business',''],['Redo the bathroom','big','house','Bathroom'],['Pay the house insurance','small','bills','March'],['Compare energy tariffs','small','bills',''],['Fix the dripping kitchen tap','small','house','Kitchen'],['Book the boiler service','small','house','September'],['Clear the gutters','small','garden',''],['Book the dentist','small','health',''],['Renew the car tax','small','car',''],['Check passport expiry dates','small','trips',''],['Update the wills','small','paper','']];
 var base=Date.now();ex.forEach(function(x,i){D.tasks.push({id:id(),ex:true,text:x[0],size:x[1],area:x[2],tag:x[3],to:null,by:L.me,done:false,n:base-i,updated:now()});});
 L.welcomed=true;changed();
}
function addIdea(text,size){text=text.replace(/^[\s\-\*•\d\.\)]+/,'').trim();if(!text)return;var c=context(),nid=id();ui.fresh=nid;D.tasks.push({id:nid,text:text,size:size||ui.dsize,area:c.area,tag:c.tag,to:null,by:L.me,done:false,n:Date.now(),updated:now()});L.welcomed=true;}
function setOwner(t,v){t.to=v;kids(t.id).forEach(function(k){k.to=v;k.updated=now();});ui.fresh=t.id;touch(t);}
function nest(child,parent){
 if(!child||!parent||child===parent||child.parent||parent.parent)return false;
 if(kids(child.id).length){alert('That note already has its own steps, so it cannot go inside another one.');return false;}
 child.parent=parent.id;child.to=parent.to;child.n=Date.now();child.updated=now();parent.size='big';parent.updated=now();ui.fresh=parent.id;changed();return true;
}

/* ---- events ---- */
document.addEventListener('change',function(e){var el=e.target,t=byId(el.getAttribute('data-id'));if(el.getAttribute('data-act')==='tick'&&t){t.done=el.checked;touch(t);draw();}});
document.addEventListener('keydown',function(e){
 if(e.key!=='Enter')return;var el=e.target;
 if(el.id==='qa'){e.preventDefault();addIdea(el.value);el.value='';changed();draw(true);var q=document.getElementById('qa');if(q)q.focus();}
 else if(el.hasAttribute('data-brk')){e.preventDefault();var p=el.getAttribute('data-brk'),tx=el.value.trim(),par=byId(p);if(tx&&par){D.tasks.push({id:id(),text:tx,size:'small',area:par.area,to:par.to,parent:p,by:L.me,done:false,n:Date.now(),updated:now()});par.size='big';par.updated=now();changed();draw(true);var nb=document.querySelector('[data-brk="'+p+'"]');if(nb)nb.focus();}}
 else if(el.isContentEditable){e.preventDefault();el.blur();}
});
document.addEventListener('focusout',function(e){
 var el=e.target;
 if(el.isContentEditable){var t=byId(el.getAttribute('data-id')),v=el.textContent.trim();el.contentEditable='false';if(t&&v&&v!==t.text){t.text=v;touch(t);}draw(true);}
 else if(ui.defer)setTimeout(function(){if(!typing())draw(true);},50);
});
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;var act=b.getAttribute('data-act'),t=byId(b.getAttribute('data-id'));
 if(act==='edit'){if(b.isContentEditable)return;b.contentEditable='true';b.focus();var r=document.createRange();r.selectNodeContents(b);var s=getSelection();s.removeAllRanges();s.addRange(r);return;}
 if(act==='me'){L.me=+b.getAttribute('data-i');}
 else if(act==='tab'){L.tab=b.getAttribute('data-t');scrollTo(0,0);}
 else if(act==='stage'){L.stage=b.getAttribute('data-k');if(L.stage==='areas')L.walkOpen=false;}
 else if(act==='begin'){L.welcomed=true;L.stage='warm';}
 else if(act==='previ'){var pk=b.getAttribute('data-k'),pn=pk==='warm'?WARM.length:12;L.idx[pk]=Math.max(0,(idx(pk)%pn)-1);}
 else if(act==='seti'){L.idx[b.getAttribute('data-k')]=+b.getAttribute('data-i');}
 else if(act==='prevpart'){var pa=area(L.area)||AREAS[0],pn2=pa.parts?pa.parts.length:12,pc=(L.part[pa.k]||0)%pn2;if(pc>0)L.part[pa.k]=pc-1;else{var tl=tilesList(),pv=tl[(tl.indexOf(pa)-1+tl.length)%tl.length];L.area=pv.k;L.part[pv.k]=(pv.parts?pv.parts.length:12)-1;}}
 else if(act==='nexti'){var k=b.getAttribute('data-k');L.idx[k]=idx(k)+1;}
 else if(act==='nextpart'){var ca=area(L.area)||AREAS[0],cn=ca.parts?ca.parts.length:12,cp=(L.part[ca.k]||0)%cn;if(cp<cn-1)L.part[ca.k]=cp+1;else{L.part[ca.k]=0;L.area=nextArea(ca).k;L.part[L.area]=0;}}
 else if(act==='addcat'){var nm=prompt('Name the new area, for example “Allotment” or “Grandparents”');if(nm&&nm.trim()){var ck='c'+id();D.cats.push({k:ck,n:nm.trim().slice(0,40),u:now()});L.walkOpen=true;L.area=ck;L.part[ck]=0;L.stage='areas';changed();}}
 else if(act==='delcat'){var dk=b.getAttribute('data-k');if(confirm('Remove this area? Its notes stay on the wall.')){D.cats.forEach(function(c){if(c.k===dk){c.gone=true;c.u=now();}});D.tasks.forEach(function(t){if(t.area===dk){t.area='wild';t.updated=now();}});L.area='house';changed();}}
 else if(act==='part'){L.part[L.area]=+b.getAttribute('data-i');}
 else if(act==='allareas'){L.walkOpen=false;}
 else if(act==='area'){L.walkOpen=true;L.area=b.getAttribute('data-k');L.part[L.area]=0;L.stage='areas';L.welcomed=true;}
 else if(act==='timer'){ui.timer=ui.timer>Date.now()?0:Date.now()+120000;}
 else if(act==='starter'){addIdea(b.getAttribute('data-v'));changed();}
 else if(act==='dsize'){ui.dsize=b.getAttribute('data-v');}
 else if(act==='qadd'){var q=document.getElementById('qa');addIdea(q.value);q.value='';changed();}
 else if(act==='example'){example();}
 else if(act==='clearex'){removeAll(exList());}
 else if(act==='clearall'){if(confirm('Clear every note from the wall and from Share out, for both of you? This cannot be undone.'))removeAll(D.tasks.slice());}
 else if(act==='give'&&t){var v=b.getAttribute('data-i');setOwner(t,v===''?null:+v);}
 else if(act==='size'&&t){t.size=t.size==='big'?'small':'big';touch(t);}
 else if(act==='nn'&&t){t.nn=true;touch(t);}
 else if(act==='unnn'&&t){delete t.nn;touch(t);}
 else if(act==='unlink'&&t){delete t.parent;t.n=Date.now();touch(t);}
 else if(act==='brk'&&t){ui.open[t.id]=!ui.open[t.id];draw(true);var nb=document.querySelector('[data-brk="'+t.id+'"]');if(nb)nb.focus();return;}
 else if(act==='del'&&t){var rm=[t].concat(kids(t.id));rm.forEach(function(x){D.gone.push({id:x.id,at:now()});});D.tasks=D.tasks.filter(function(x){return rm.indexOf(x)<0;});changed();}
 else if(act==='plan'||act==='replan'){D.day[today()+':'+L.me]=pickDay(L.me);changed();}
 else if(act==='more'){var d=D.day[today()+':'+L.me],used=d.big.concat(d.small),nx=live().filter(function(x){return !x.done&&x.to===L.me&&used.indexOf(x.id)<0;})[0];if(nx){(nx.size==='big'?d.big:d.small).push(nx.id);d.u=now();changed();}else alert('Nothing more belongs to '+NAMES[L.me]+'.');}
 else if(act==='start'){L.code=newCode();ui.status='Starting…';persist();sync();}
 else if(act==='join'){var c=(document.getElementById('jc').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==12){alert('That code should have 12 letters and numbers.');return;}L.code=c;ui.status='Joining…';persist();sync();}
 else if(act==='locally'){L.local=true;L.tab='brain';}
 else if(act==='syncnow'){sync();}
 else if(act==='leave'){if(confirm('Stop sharing on this device? Your copy stays here.'))L.code='';}
 persist();draw(true);
 if(act==='area'||act==='nextpart'||act==='prevpart'){var st=document.querySelector('.stage');if(st&&st.getBoundingClientRect().top<0)st.scrollIntoView({block:'start',behavior:'smooth'});}
});
/* drag and drop: onto a note = make it a step; onto a column = give it to that person */
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('[draggable][data-id]');if(!c)return;e.dataTransfer.setData('text/plain',c.getAttribute('data-id'));e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
function clearOver(){document.querySelectorAll('.over').forEach(function(x){x.classList.remove('over');});}
document.addEventListener('dragend',function(e){var c=e.target.closest&&e.target.closest('[data-id]');if(c)c.classList.remove('dragging');clearOver();});
function target(e){return (e.target.closest&&(e.target.closest('.note[data-id]')||e.target.closest('.col')));}
document.addEventListener('dragover',function(e){var c=target(e);if(!c)return;e.preventDefault();if(!c.classList.contains('over')){clearOver();c.classList.add('over');}});
document.addEventListener('drop',function(e){var c=target(e);if(!c)return;e.preventDefault();clearOver();var t=byId(e.dataTransfer.getData('text/plain'));if(!t)return;
 if(c.classList.contains('note')){nest(t,byId(c.getAttribute('data-id')));}
 else{var v=c.getAttribute('data-to');setOwner(t,v===''?null:+v);}
 draw(true);});
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync();});
setInterval(function(){if(!document.hidden)sync();},20000);
draw(true);sync();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});

})();
</script>
