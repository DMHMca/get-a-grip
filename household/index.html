<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get a Grip Household has moved</title>
<meta http-equiv="refresh" content="3; url=https://dmhmca.github.io/get-a-grip-household/">
<style>
:root{--acc:#5B3A7A;--bg:#F3F4F2;--tx:#1B1F1D}
@media (prefers-color-scheme:dark){:root{--acc:#C9A7E8;--bg:#16181a;--tx:#ECEEEC}}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.5 system-ui,sans-serif;padding:40px 16px;max-width:560px;margin:auto}
h1{color:var(--acc);font-size:1.4rem}
a{color:var(--acc);font-weight:700}
</style>
</head>
<body>
<h1>Get a Grip Household has moved</h1>
<p>It now lives at its own address. Your notes and household code come with it.</p>
<p><a href="https://dmhmca.github.io/get-a-grip-household/">Open Get a Grip Household</a></p>
<p>If you installed the old one on your phone or laptop, remove it and install it again from the new address.</p>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(r.scope.indexOf('/get-a-grip/household/')>-1)r.unregister();});});</script>
</body>
</html>
