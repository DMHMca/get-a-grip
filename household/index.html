<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Household (demo)</title>
<meta name="theme-color" content="#5B3A7A">
<style>
:root{--acc:#5B3A7A;--bg:#F3F4F2;--tx:#1B1F1D;--card:#fff;--line:#d5d8d4;--big:#1F5C99;--small:#8A5A00;--mut:#5b625e}
@media (prefers-color-scheme:dark){:root{--acc:#C9A7E8;--bg:#16181a;--tx:#ECEEEC;--card:#22262a;--line:#3a4044;--big:#8DBBEB;--small:#E8B75A;--mut:#a5aca8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;padding:0 16px 40px;max-width:640px;margin:auto}
h1{font-size:1rem;color:var(--acc);margin:14px 0 4px}
h2{font-size:1.1rem;margin:18px 0 6px}
button,select,textarea,input{font:inherit;color:inherit}
button{min-height:44px;padding:8px 14px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
@media (prefers-color-scheme:dark){button.on{color:#16181a}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.tabs button{flex:1}
textarea{width:100%;min-height:150px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
select,input[type=text]{min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:8px 10px;margin:6px 0}
.task.big{border-left-color:var(--big)}.task.small{border-left-color:var(--small)}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.task input[type=checkbox]{width:26px;height:26px;margin-top:2px;flex:none}
.t{flex:1;word-break:break-word}.meta{font-size:.82rem;color:var(--mut)}
.tag{font-size:.8rem;font-weight:700}.tag.big{color:var(--big)}.tag.small{color:var(--small)}
.mut{color:var(--mut);font-size:.9rem}
.note{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px;margin:10px 0}
.mini{min-height:36px;padding:4px 10px;font-size:.9rem}
</style>
</head>
<body>
<h1>Household (demo)</h1>
<div class="mut">A shared list for two people, built on the idea of a few big things and a few small things each day. Demo only: made-up tasks, kept on this phone, nothing sent anywhere.</div>
<div id="app"></div>
<script>
(function(){
var KEY='household.demo.v1';
var S=load();
var ui={tab:'brain',me:0};
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return {people:['Lauren','Partner'],tasks:[],day:{}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function id(){return 'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function who(i){return i===null||i===undefined||i===''?'Unassigned':S.people[i];}
function example(){
 var L=0,P=1,n=null;
 [['Company website: finish the build and the SEO',1,'big',L],['Job applications: send three this week',1,'big',P],['Phone app for sale: get the first version working',1,'big',P],['House: redo the bathroom',1,'big',n],
  ['Pay the house insurance (every year, must happen)',0,'small',L],['Fix the leaking kitchen tap',0,'small',P],['Book the boiler service',0,'small',n],['Order the dog food',0,'small',L],['Call the dentist',0,'small',n],['Clear the gutters',0,'small',P],['Renew the car tax',0,'small',n]
 ].forEach(function(x){S.tasks.push({id:id(),text:x[0],size:x[2],to:x[3],by:x[1],done:false});});
 save();
}
function sizeBtn(t){return '<button class="mini" data-act="size" data-id="'+t.id+'">'+(t.size==='big'?'Big':'Small')+'</button>';}
function assignSel(t){var o='<option value="">Unassigned</option>';S.people.forEach(function(p,i){o+='<option value="'+i+'"'+(t.to===i?' selected':'')+'>'+esc(p)+'</option>';});return '<select data-act="assign" data-id="'+t.id+'" aria-label="Assign to">'+o+'</select>';}
function taskRow(t,full){
 return '<div class="task '+t.size+(t.done?' done':'')+'"><input type="checkbox" data-act="tick" data-id="'+t.id+'" aria-label="Done"'+(t.done?' checked':'')+'>'
 +'<div class="t"><span class="tag '+t.size+'">'+(t.size==='big'?'Big':'Small')+'</span> '+esc(t.text)
 +'<div class="meta">'+(t.by!==undefined&&t.by!==null&&t.by!==t.to?'Added by '+esc(who(t.by)):'')+'</div>'
 +(full?'<div class="row">'+sizeBtn(t)+assignSel(t)+'<button class="mini" data-act="del" data-id="'+t.id+'">Delete</button></div>':'')
 +'</div></div>';
}
function head(){
 var h='<div class="row"><span class="mut">Who is using this phone?</span>';
 S.people.forEach(function(p,i){h+='<button class="'+(ui.me===i?'on':'')+'" data-act="me" data-i="'+i+'">'+esc(p)+'</button>';});
 h+='<button class="mini" data-act="rename">Change names</button></div>';
 h+='<div class="row tabs">'+[['brain','Brainstorm'],['list','Everyone’s list'],['day','My day']].map(function(x){return '<button class="'+(ui.tab===x[0]?'on':'')+'" data-act="tab" data-t="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>';
 return h;
}
function brain(){
 var h='<h2>Get it all out</h2><div class="mut">Type or dictate everything that needs doing, one thing per line. No need to decide who or when yet.</div>'
 +'<textarea id="dump" placeholder="Pay the insurance\nCall the plumber\nFinish the website SEO"></textarea>'
 +'<div class="row"><span class="mut">These are mostly</span><button class="on" data-act="dsize" data-v="small" id="ds-small">Small</button><button data-act="dsize" data-v="big" id="ds-big">Big</button>'
 +'<span class="mut">for</span><select id="dto"><option value="">Unassigned (decide later)</option>'+S.people.map(function(p,i){return '<option value="'+i+'">'+esc(p)+'</option>';}).join('')+'</select></div>'
 +'<div class="row"><button class="on" data-act="adddump">Add these</button>'+(S.tasks.length?'':'<button data-act="example">Fill with made-up family tasks</button>')+'</div>';
 var un=S.tasks.filter(function(t){return !t.done&&(t.to===null||t.to===undefined);});
 h+='<h2>Still to hand out ('+un.length+')</h2>';
 if(!un.length)h+='<div class="note mut">Nothing waiting. Everything has an owner.</div>';
 un.forEach(function(t){h+=taskRow(t,true);});
 return h;
}
function list(){
 var h='';
 [null].concat(S.people.map(function(_,i){return i;})).forEach(function(p){
  var ts=S.tasks.filter(function(t){return (t.to===undefined?null:t.to)===p;});
  var open=ts.filter(function(t){return !t.done;}),done=ts.filter(function(t){return t.done;});
  var big=open.filter(function(t){return t.size==='big';}).length;
  h+='<h2>'+esc(who(p))+' <span class="mut">('+big+' big, '+(open.length-big)+' small)</span></h2>';
  if(!ts.length)h+='<div class="mut">Nothing here.</div>';
  open.forEach(function(t){h+=taskRow(t,true);});
  if(done.length)h+='<div class="mut">Done: '+done.length+'</div>';
 });
 return h;
}
function pickDay(me){
 var open=S.tasks.filter(function(t){return !t.done&&t.to===me;});
 return {big:open.filter(function(t){return t.size==='big';}).slice(0,1).map(function(t){return t.id;}),small:open.filter(function(t){return t.size!=='big';}).slice(0,3).map(function(t){return t.id;})};
}
function day(){
 var me=ui.me,k=today()+':'+me,d=S.day[k];
 var h='<h2>'+esc(S.people[me])+'’s day</h2>';
 if(!d){
  h+='<div class="note">A short menu for today: one big thing and up to three small things from what has been handed to '+esc(S.people[me])+'. Nothing else is shown, so it never looks like a mountain.</div>'
   +'<div class="row"><button class="on" data-act="plan">Plan my day</button></div>';
  return h;
 }
 var all=d.big.concat(d.small).map(function(i){return S.tasks.filter(function(t){return t.id===i;})[0];}).filter(Boolean);
 var done=all.filter(function(t){return t.done;}).length;
 h+='<div class="mut">'+done+' of '+all.length+' done</div>';
 all.forEach(function(t){h+=taskRow(t,false);});
 var bt=all.length&&done===all.length;
 if(bt)h+='<div class="note">That is today done. Anything else is a bonus.</div>';
 h+='<div class="row"><button data-act="more">Bring in one more</button><button data-act="replan">Start the day again</button></div>';
 var sent=S.tasks.filter(function(t){return !t.done&&t.by===me&&t.to!==null&&t.to!==undefined&&t.to!==me;});
 if(sent.length)h+='<h2>Handed to others by you ('+sent.length+')</h2>'+sent.map(function(t){return '<div class="meta">'+esc(t.text)+' → '+esc(who(t.to))+'</div>';}).join('');
 return h;
}
function render(){
 var a=document.getElementById('app'),keep='';var ta=document.getElementById('dump');if(ta)keep=ta.value;
 a.innerHTML=head()+(ui.tab==='brain'?brain():ui.tab==='list'?list():day());
 var n=document.getElementById('dump');if(n)n.value=keep;
 var s=document.getElementById('ds-'+(ui.dsize||'small'));if(s&&ui.dsize==='big'){document.getElementById('ds-small').className='';document.getElementById('ds-big').className='on';}
}
function byId(i){return S.tasks.filter(function(t){return t.id===i;})[0];}
document.addEventListener('change',function(e){
 var el=e.target,act=el.getAttribute('data-act'),t=byId(el.getAttribute('data-id'));
 if(act==='tick'&&t){t.done=el.checked;save();render();}
 if(act==='assign'&&t){t.to=el.value===''?null:+el.value;save();render();}
});
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;var act=b.getAttribute('data-act'),t=byId(b.getAttribute('data-id'));
 if(act==='me'){ui.me=+b.getAttribute('data-i');}
 else if(act==='tab'){ui.tab=b.getAttribute('data-t');}
 else if(act==='dsize'){ui.dsize=b.getAttribute('data-v');}
 else if(act==='adddump'){
  var lines=document.getElementById('dump').value.split(/\n/).map(function(x){return x.replace(/^[\s\-\*•\d\.\)]+/,'').trim();}).filter(Boolean);
  var to=document.getElementById('dto').value;
  lines.slice().reverse().forEach(function(x){S.tasks.unshift({id:id(),text:x,size:ui.dsize||'small',to:to===''?null:+to,by:ui.me,done:false});});
  document.getElementById('dump').value='';save();
 }
 else if(act==='example'){example();}
 else if(act==='size'&&t){t.size=t.size==='big'?'small':'big';save();}
 else if(act==='del'&&t){S.tasks=S.tasks.filter(function(x){return x!==t;});save();}
 else if(act==='rename'){
  var a=prompt('First name',S.people[0]);if(a&&a.trim())S.people[0]=a.trim();
  var c=prompt('Second name',S.people[1]);if(c&&c.trim())S.people[1]=c.trim();save();
 }
 else if(act==='plan'||act==='replan'){var k=today()+':'+ui.me;S.day[k]=pickDay(ui.me);save();}
 else if(act==='more'){
  var k2=today()+':'+ui.me,d=S.day[k2];
  var used=d.big.concat(d.small);
  var nx=S.tasks.filter(function(t2){return !t2.done&&t2.to===ui.me&&used.indexOf(t2.id)<0;})[0];
  if(nx){(nx.size==='big'?d.big:d.small).push(nx.id);save();}else alert('Nothing more has been handed to '+S.people[ui.me]+'.');
 }
 render();
});
render();
})();
</script>
</body>
</html>
