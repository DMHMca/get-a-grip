<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Get a grip (preview)</title>
<meta name="description" content="Get a grip: a plain to-do list with activities.">
<meta name="theme-color" content="#5B3A7A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grip preview">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F2; --surface:#ffffff; --text:#1B1F1D; --muted:#5B625E;
  --line:#D9DCD8; --border:#BFC5C0; --accent:#5B3A7A; --on-accent:#ffffff;
  --tint:#ECE5F2; --scrim:rgba(27,31,29,.5); --dot:#B5BBB6; --danger:#8A4B00;
  --big:#1F5F99; --big-edge:#123E66; --small:#E8A317; --small-edge:#7A5200;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191A; --surface:#1F2527; --text:#E8ECEA; --muted:#A0A8A4;
    --line:#2F3639; --border:#4A5357; --accent:#C3A5E6; --on-accent:#21102F;
    --tint:#2E2638; --scrim:rgba(0,0,0,.6); --dot:#4A5357; --danger:#F0B45A;
    --big:#7FB6E8; --big-edge:#BFE0FA; --small:#F0B93A; --small-edge:#FFE2A0;
  }
}
:root[data-theme="dark"]{
  --bg:#15191A; --surface:#1F2527; --text:#E8ECEA; --muted:#A0A8A4;
  --line:#2F3639; --border:#4A5357; --accent:#C3A5E6; --on-accent:#21102F;
  --tint:#2E2638; --scrim:rgba(0,0,0,.6); --dot:#4A5357; --danger:#F0B45A;
  --big:#7FB6E8; --big-edge:#BFE0FA; --small:#F0B93A; --small-edge:#FFE2A0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;-webkit-text-size-adjust:100%}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.btn{flex:none;height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--border);background:transparent;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.danger{border-color:var(--danger);color:var(--danger);font-weight:700}
.btn.icon{width:44px;padding:0}
.tab{flex:1;min-width:0;justify-content:space-between;text-align:left;padding:0 10px 0 14px}
.tab span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{flex:1;margin:0;font-size:20px;font-weight:700}
.tools{flex:none;display:flex;gap:6px}
.apphead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 8px 0 16px;min-height:52px}
.apphead + .topbar{padding-top:2px}
.brand{flex:1;min-width:0;margin:0;font-size:14px;line-height:1.2;font-weight:700;letter-spacing:.02em;color:var(--accent)}
.menubtn{flex:none;width:48px;height:48px;border:0;background:none;padding:0;color:var(--text);display:flex;align-items:center;justify-content:center;border-radius:12px}
.addwrap{padding:8px 16px 0}
.addbox{display:flex;align-items:center;min-height:56px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:0 6px 0 16px;gap:8px}
.addbox input,.addbox textarea{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:17px;color:var(--text);height:48px}
.addbox textarea{resize:none;overflow:hidden;line-height:1.3;padding:13px 0;display:block}
.addbox input:focus-visible,.addbox textarea:focus-visible{outline:0}
.field textarea.tt{min-height:52px;height:52px;resize:none;overflow:hidden;line-height:1.3;padding:14px;font-size:17px}
.addbox:focus-within{border-color:var(--accent)}
.addbox .go{flex:none;width:44px;height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;padding:0}
.chip{margin-top:8px;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--border);background:transparent;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip b{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 8px}
.meta .count{font-size:15px;color:var(--muted)}
.meta .acts{display:flex;gap:8px}
.list{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.row{display:flex;flex-wrap:wrap;align-items:center;min-height:60px;padding:0 4px 0 4px;border-bottom:1px solid var(--line)}
.tick{flex:none;width:48px;height:48px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.rowtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 0;text-align:left;background:none;border:0;font-size:17px;line-height:1.3;color:var(--text);overflow-wrap:anywhere}
.rowtext small{font-size:14px;color:var(--muted)}
.more{flex:none;width:44px;height:48px;border:0;background:none;padding:0;color:var(--muted);display:flex;align-items:center;justify-content:center}
.more[aria-expanded="true"]{color:var(--accent)}
.details{flex:0 0 100%;padding:0 52px 12px 48px;font-size:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.details a{color:var(--accent);text-decoration:underline}
.field textarea{width:100%;min-height:96px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:16px;line-height:1.4;padding:12px 14px;resize:vertical}
.field textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rtl{display:flex;align-items:flex-start;gap:8px}
.rtl svg{margin-top:3px}
.row.big .rtl>span{font-weight:700}
.partsbar{flex:0 0 100%;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 52px 4px 48px;border:0;background:none;text-align:left;font-size:15px;color:var(--muted)}
.partsbar[aria-expanded="true"]{color:var(--accent)}
.partsbar b{font-weight:700;color:var(--text)}
.parts{flex:0 0 100%;min-width:0;padding:0 12px 10px 48px}
.part{display:flex;align-items:center;min-height:46px}
.part .ptick{flex:none;width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.part .ptext{flex:1;min-width:0;border:0;background:none;text-align:left;font-size:16px;line-height:1.3;padding:8px 0;color:var(--text);overflow-wrap:anywhere}
.part.done .ptext{color:var(--muted);text-decoration:line-through}
.padd{display:flex;align-items:center;gap:8px;min-height:46px;padding-left:44px;min-width:0}
.padd input{flex:1;width:0;min-width:0;height:42px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:16px;padding:0 12px}
.padd button{flex:none;width:42px;height:42px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;padding:0}
.card{margin:12px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px}
.card h3{margin:0 0 4px;font-size:17px}
.card p{margin:6px 0;line-height:1.45;color:var(--muted);font-size:15px}
.two{display:flex;gap:8px}
.two .btn{flex:1;height:52px;font-size:17px}
.choice{display:flex;width:100%;align-items:center;gap:12px;min-height:56px;padding:8px 14px;margin-top:8px;border-radius:12px;border:1.5px solid var(--border);background:transparent;text-align:left;font-size:17px}
.choice small{display:block;font-size:14px;color:var(--muted)}
.choice[aria-pressed="true"]{background:var(--tint);border-color:var(--accent)}
.sec{margin:0;padding:14px 16px 4px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--muted);text-transform:none}
.item{display:flex;align-items:center;min-height:60px;padding:0 4px;border-bottom:1px solid var(--line);background:var(--surface)}
.item.done .itext{color:var(--muted);text-decoration:line-through}
.itext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 0;border:0;background:none;text-align:left;font-size:17px;line-height:1.3;color:var(--text);overflow-wrap:anywhere}
.itext small{font-size:14px;color:var(--muted)}
.item .chg{flex:none;height:44px;padding:0 12px;border:0;background:none;color:var(--accent);font-size:15px;font-weight:700}
.dayhead{padding:2px 16px 0;color:var(--muted);font-size:15px}
.prog{padding:10px 16px 0;font-size:16px;font-weight:700}
.hist{border-top:1px solid var(--line);margin-top:16px}
.histrow{display:flex;width:100%;align-items:center;gap:10px;min-height:56px;padding:8px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:16px}
.histrow .t{flex:1;min-width:0}
.histrow small{display:block;font-size:14px;color:var(--muted)}
.histdet{padding:4px 16px 12px 16px;font-size:15px;line-height:1.5;border-bottom:1px solid var(--line)}
.histdet div{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.histdet .mk{flex:none;width:18px;color:var(--accent);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
.tags .btn{height:44px;font-size:15px;padding:0 12px}
.tags .btn[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);font-weight:700}
@media (min-width:900px){
  #app.wide{max-width:960px}
  .daygrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
}
.bcard{margin:10px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bhead{display:block;flex:1;min-width:0;text-align:left;border:0;background:none;padding:12px 14px 10px}
.bhead .tt{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:17px;line-height:1.3}
.bhead small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.bhead .pb{height:6px;background:var(--line);border-radius:3px;margin-top:8px}
.bhead .pb i{display:block;height:6px;background:var(--big);border-radius:3px}
.bhead .prv{color:var(--muted);font-size:14px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.bbody{border-top:1px solid var(--line);padding:10px 0 12px}
.bbody label{display:block;padding:0 14px;font-size:14px;color:var(--muted)}
.thinking{display:block;width:calc(100% - 28px);margin:6px 14px 0;min-height:96px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:16px;line-height:1.4;padding:12px;resize:none;overflow:hidden}
.bbody .parts{padding:8px 8px 0 14px}
.bgroup{margin:0;padding:16px 16px 0;font-size:15px;font-weight:700;color:var(--muted)}
.blocks{padding:0 12px}
.bblock{margin:6px 0 0;background:var(--surface);border:2px solid var(--big);border-radius:14px;padding:10px 12px}
.bblock .tt{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:15px;line-height:1.3}
.bblock .sm{color:var(--muted);font-size:12px;margin:2px 0 0}
.bblock .pb{height:6px;background:var(--line);border-radius:3px;margin-top:8px}
.bblock .pb i{display:block;height:6px;background:var(--big);border-radius:3px}
.bi{display:flex;align-items:center;gap:4px;min-height:44px;margin-top:4px}
.bi.done .bt{color:var(--muted);text-decoration:line-through}
.bi .bt{flex:1;min-width:0;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.bi .tk,.tile .tk{flex:none;width:34px;height:34px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.bi .tk svg,.tile .tk svg{width:21px;height:21px}
.bi .chg{flex:none;height:40px;padding:0 6px;border:0;background:none;color:var(--accent);font-size:13px;font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.tile{background:var(--surface);border:1.5px solid var(--border);border-left:5px solid var(--small);border-radius:10px;padding:2px 5px 5px 3px;height:86px;font-size:12px;line-height:1.28;cursor:pointer;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tile .top{display:flex;align-items:center;gap:1px;flex:none}
.tile .tk{flex:none;width:30px;height:30px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.tile .tk svg{width:19px;height:19px}
.tile .top svg.hs{margin:0 0 0 1px;width:14px;height:14px}
.tile .tx{padding:0 2px 0 4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile .sb{color:var(--muted);font-size:11.5px;padding:2px 2px 0 4px;overflow-wrap:anywhere}
.tile.done .tx{color:var(--muted);text-decoration:line-through}
.tile.open{grid-column:1/4;height:auto;background:var(--tint);border-color:var(--accent);border-left-color:var(--small);font-size:14px;overflow:visible}
.tile.open .tx{display:block;-webkit-line-clamp:unset;padding:2px 4px 0}
.tile .acts{display:flex;gap:8px;padding:8px 0 2px 4px}
.tile .acts button{height:40px;padding:0 14px;border-radius:9px;border:1.5px solid var(--accent);background:none;color:var(--accent);font-weight:700;font-size:13px}
.tile.add{border-style:dashed;border-left-style:dashed;color:var(--muted);align-items:center;justify-content:center;flex-direction:column;gap:2px;text-align:center;font-size:12px}
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;color:var(--muted);font-size:14px;min-height:36px}
.dayrow .sorts{padding:0;gap:6px}
.dayrow .sorts .btn{height:32px;font-size:13px;padding:0 10px}
.bigtoggle{display:flex;width:100%;align-items:center;gap:10px;min-height:52px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:var(--tint);text-align:left;font-size:16px}
.bigtoggle span.l{flex:1;font-weight:700}
.seg{display:flex;gap:8px}
.seg .btn{flex:1;gap:10px}
.seg .btn[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);font-weight:700}
.row.done .rowtext{color:var(--muted);text-decoration:line-through}
.empty{padding:28px 20px;color:var(--muted);line-height:1.45}
.strip{margin:8px 16px 0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 16px}
.strip div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.strip small{font-size:14px;color:var(--muted)}
.strip span{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.nav{flex:none;position:relative;display:flex;border-top:1px solid var(--line);background:var(--surface);margin-top:8px}
.navscroll{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.navscroll::-webkit-scrollbar{display:none}
.navscroll button{flex:1 0 70px;height:64px;border:0;border-top:3px solid transparent;background:transparent;font-size:14px;line-height:1.15;color:var(--muted);padding:0 8px;display:flex;align-items:center;justify-content:center;text-align:center}
.navscroll button span{min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.navscroll button[aria-current="page"]{color:var(--accent);font-weight:700;border-top-color:var(--accent);background:var(--tint)}
.navarrow{flex:none;width:40px;height:64px;border:0;border-top:3px solid transparent;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.navarrow[hidden]{display:none}
.handle{flex:none;width:44px;height:48px;border:0;background:none;padding:0;color:var(--muted);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.row.dragging,.arow.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:12px}
.arow{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-right:4px}
.arow .navrow{border-bottom:0;flex:1;min-width:0;width:auto}
.navrow{display:flex;width:100%;align-items:center;gap:12px;min-height:68px;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:17px}
.navrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.navrow b{font-weight:700;overflow-wrap:anywhere}
.navrow small{font-size:14px;color:var(--muted)}
.navrow.static{cursor:default}
.pad{padding:0 16px 16px}
.pad .btn{width:100%;height:52px;font-size:17px}
.sect{margin:0;padding:16px 16px 0;font-size:17px;font-weight:700}
.adv{border-top:1px solid var(--line);margin-top:12px}
.adv summary{cursor:pointer;padding:14px 16px;font-size:17px;font-weight:700;min-height:48px}
.adv summary:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.foot a{color:var(--accent)}
.pad.two{display:flex;gap:8px}
.pad.two .btn{flex:1;width:auto;min-width:0;padding:0 8px}
.sorts{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
.sorts .btn{height:40px;font-size:15px;padding:0 12px}
.sorts .btn[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);font-weight:700}
.hit{font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.foot{padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.4}
.foot button{background:none;border:0;padding:0;color:var(--accent);font-size:14px;text-decoration:underline}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 0 calc(20px + env(safe-area-inset-bottom,0px));max-height:82%;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 8px}
.sheet h2{margin:0;padding:8px 20px;font-size:17px;font-weight:700}
.opt{display:flex;width:100%;align-items:center;gap:12px;min-height:56px;padding:0 20px 0 54px;border:0;background:transparent;text-align:left;font-size:17px}
.opt span.l{flex:1;min-width:0;overflow-wrap:anywhere}
.opt small{font-size:14px;color:var(--muted)}
.opt.sel{background:var(--tint);font-weight:700;padding-left:20px}
.opt.link{padding-left:20px;font-weight:700;color:var(--accent)}
.sep{margin:6px 20px 0;border-top:1px solid var(--line)}
.field{padding:8px 20px 0;display:flex;flex-direction:column;gap:12px}
.field input[type=text],.field select{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:17px;padding:0 14px}
.field label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.field .btns{display:flex;gap:8px}
.field .btns .btn{flex:1;height:48px}
.txt{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:16px;padding:0 14px}
.sel{width:100%;height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:15px;padding:0 10px;margin-top:6px}
.note{margin:0;padding:12px 16px;color:var(--muted);line-height:1.45;font-size:15px}
.err{padding:8px 16px;color:var(--danger);font-size:15px;line-height:1.4}
.ok{padding:8px 16px;color:var(--accent);font-size:15px;font-weight:700}
.bar{flex:none;display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface)}
.bar .btn{flex:1;min-width:0;height:48px;padding:0 8px;font-size:15px}
.bar .btn[disabled]{opacity:.45}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- state ---------- */
var KEY='next.tasks.v1';var LIVEKEY='tasks.v1';
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function iso(){return new Date().toISOString();}
function seed(){
  return {v:1,updatedAt:0,activities:[],tasks:[]};
}
function loadLocal(){
  try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&s.activities&&s.tasks)return s;}}catch(e){}
  return null;
}
var S=loadLocal()||seed();

var ui={view:'today',back:[],partsOpen:{},bigCards:{},tileOpen:{},bigOpen:false,activityId:null,lastActivityId:null,sheet:null,draft:'',pick:null,lastTicked:null,
  q:'',sort:'archived',rev:false,editId:null,afterCreate:null,status:'device',open:{},dirty:false,dragging:false};

/* ---------- persistence ---------- */
function commit(fromSync){
  S.updatedAt=Date.now();
  var ok=true;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){ok=false;}
  ui.status=ok?'device':'failed';
  if(fromSync===true){softRender();}else{render();scheduleSync();}
}
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}

/* ---------- helpers ---------- */
function act(id){return S.activities.find(function(a){return a.id===id;})||null;}
function task(id){return S.tasks.find(function(t){return t.id===id;})||null;}
function live(){return S.activities.filter(function(a){return !a.archived;});}
function archived(){return S.activities.filter(function(a){return a.archived;});}
function tasksOf(id){return S.tasks.filter(function(t){return t.activityId===id;});}
function openCount(id){return tasksOf(id).filter(function(t){return !t.done;}).length;}
function fmt(d){try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return '';}}
function summary(a){
  var ts=tasksOf(a.id),o=ts.filter(function(t){return !t.done;}).length,d=ts.length-o;
  if(!ts.length)return 'No tasks yet';
  if(!o)return 'All '+ts.length+' done';
  return o+' open, '+(d?d+' done':'none done');
}
function svg(inner,size,extra){
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',size||22);s.setAttribute('height',size||22);s.setAttribute('viewBox','0 0 24 24');
  s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2.3');
  s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');
  s.style.flex='none';
  s.innerHTML=inner;return s;
}
var ICON={
  plus:'<path d="M12 5v14M5 12h14"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  right:'<path d="M9 6l6 6-6 6"/>',
  box:'<path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/>',
  list:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  chevup:'<path d="M6 15l6-6 6 6"/>'
};
function h(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k];
    if(v===null||v===undefined||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  (kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function tickIcon(done){
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',26);s.setAttribute('height',26);s.setAttribute('viewBox','0 0 26 26');s.setAttribute('aria-hidden','true');
  s.innerHTML=done
    ?'<circle cx="13" cy="13" r="12" fill="var(--accent)"/><path d="M7.5 13.5l4 4 7-8" fill="none" stroke="var(--on-accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'
    :'<circle cx="13" cy="13" r="11" fill="none" stroke="var(--text)" stroke-width="2"/>';
  return s;
}

/* ---------- big and small jobs, and parts ---------- */
function isBig(t){return !!t&&t.size==='big';}
/* a subtask is an ordinary task with a parent: t.parent is the id of the task it sits under (one level only) */
function childrenOf(t){return t?S.tasks.filter(function(x){return x.parent===t.id;}):[];}
function partsOf(t){return childrenOf(t);}
function partsDone(t){return childrenOf(t).filter(function(p){return p.done;}).length;}
function isChild(t){return !!(t&&t.parent&&task(t.parent));}
function topLevel(t){return !isChild(t);}
function attachChoices(t){return S.tasks.filter(function(x){return x.id!==t.id&&!x.done&&!isChild(x)&&!childrenOf(x).length;});}
/* the SMALL list (internally still called master): small tasks only, never big tasks or the subtasks of big tasks (those live on the Big page).
   A small task that has subtasks shows only its next unfinished subtask, labelled with its parent, and once all are done the parent itself. */
function smallRows(){
  var out=[];
  S.tasks.forEach(function(t){
    if(t.done||isChild(t)||isBig(t)||t.nm)return;
    var kids=childrenOf(t);
    if(kids.length){
      var n=kids.find(function(c){return !c.done;});
      /* while its subtasks are opened for adding, the parent stays on show so you can keep adding; close them to go back to one at a time */
      out.push({t:(ui.partsOpen[t.id]?t:(n||t)),owner:t});
      return;
    }
    out.push({t:t,owner:t});
  });
  return out;
}
/* MASTER tasks: everything you could do next, in one list: small tasks as in the Small list, plus the next unfinished subtask of each big task
   (a big task with no subtasks yet is just itself). Order follows the order of the tasks themselves. */
function masterRows(){
  var out=[];
  S.tasks.forEach(function(t){
    if(t.done||isChild(t)||t.nm)return;
    var kids=childrenOf(t);
    if(kids.length){
      var n=kids.find(function(c){return !c.done;});
      out.push({t:(ui.partsOpen[t.id]?t:(n||t)),owner:t});
      return;
    }
    out.push({t:t,owner:t});
  });
  return out;
}
/* the next unfinished subtask of each big task: these live on the Big page, but a spare slot may well fit one */
function bigNextRows(){
  var out=[];
  S.tasks.forEach(function(t){
    if(t.done||isChild(t)||!isBig(t))return;
    var n=childrenOf(t).find(function(c){return !c.done;});
    if(n)out.push({t:n,owner:t});
  });
  return out;
}
function valueOf(t){return isChild(t)?'P:'+t.parent+':'+t.id:'T:'+t.id;}
/* ---------- "I've got a slot": time and equipment tags, and a filter ---------- */
var DURS=[['quick','15 minutes or less'],['30','About 30 minutes'],['60','About an hour'],['long','Two hours or more']];
var DEVS=[['phone','Phone'],['tablet','Tablet'],['laptop','Laptop or PC']];
function durRank(v){return DURS.findIndex(function(x){return x[0]===v;});}
function devRank(v){return DEVS.findIndex(function(x){return x[0]===v;});}
function tagText(t){
  var d=DURS.find(function(x){return x[0]===t.dur;}),v=DEVS.find(function(x){return x[0]===t.dev;});
  return [d?d[1]:'',v?v[1]:''].filter(Boolean).join(' · ');
}
function setTag(t,k,v){if(v)t[k]=v;else delete t[k];t.updated=iso();commit();}
/* tasks that could be done next, as Master tasks would offer them, minus anything already in today's plan */
function slotCandidates(){
  var pl=planFor(todayKey());
  return masterRows().filter(function(r){return !(pl&&inPlan(pl,r.t.id));});
}
function addToDay(r){
  var t=r.t,kind=(r.owner!==t&&isBig(r.owner))?'big':'little';
  var it=mkItem(kind,t.id);if(!it)return;
  var key=todayKey(),pl=planFor(key);
  if(!pl){pl=newPlan(key,'custom',[it]);}
  else{
    if(kind==='little'&&pl.items.filter(function(x){return x.k!=='big';}).length>=5){alert('Your day already has five small ones. Swap one out first.');return;}
    pl.items.push(it);
  }
  ui.planDay='today';ui.view='today';ui.sheet=null;ui.cust=null;touchPlan(pl);
}
/* subtasks sit in the order they were added: the newest goes at the bottom of the group, and can be dragged elsewhere */
function placeLast(child,parent){
  S.tasks=S.tasks.filter(function(x){return x!==child;});
  var at=S.tasks.findIndex(function(x){return x.id===parent.id;});
  S.tasks.forEach(function(x,i){if(x.parent===parent.id&&i>at)at=i;});
  S.tasks.splice(at+1,0,child);
}
function attachTo(child,parent){
  child.parent=parent.id;child.activityId=parent.activityId||null;child.updated=iso();
  placeLast(child,parent);
}
function addSub(parentId,text){
  var t=task(parentId);text=(text||'').trim();if(!t||!text)return null;
  var n={id:uid(),text:text,activityId:t.activityId||null,created:iso(),done:null,updated:iso(),parent:t.id};
  S.tasks.push(n);placeLast(n,t);t.updated=iso();return n;
}
/* older preview data kept parts inside the task; turn them into ordinary subtasks (same ids, so every device agrees) */
function migrateParts(){
  var changed=false,add=[];
  S.tasks.forEach(function(t){
    if(!Array.isArray(t.parts))return;
    t.parts.forEach(function(p){
      if(S.tasks.some(function(x){return x.id===p.id;}))return;
      var c={id:p.id,text:p.text,activityId:t.activityId||null,created:p.updated||t.created||iso(),done:p.done||null,updated:p.updated||t.updated||iso(),parent:t.id};
      add.push({after:t.id,task:c});
    });
    delete t.parts;changed=true;
  });
  add.forEach(function(a){var i=S.tasks.findIndex(function(x){return x.id===a.after;});S.tasks.splice(i+1,0,a.task);});
  plans().forEach(function(pl){pl.items.forEach(function(it){if(it.pid){it.tid=it.pid;delete it.pid;changed=true;}});});
  return changed||add.length>0;
}
function house(big){
  var n=big?26:17,s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',n);s.setAttribute('height',n);s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');s.style.flex='none';
  s.innerHTML=big
    ?'<path d="M2.5 11.5 12 3.5l9.5 8V21h-19z" fill="var(--big)" stroke="var(--big-edge)" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 21v-6h4v6" fill="none" stroke="var(--on-accent)" stroke-width="1.8" stroke-linejoin="round"/>'
    :'<path d="M3 11.5 12 4l9 7.5V20H3z" fill="var(--small)" stroke="var(--small-edge)" stroke-width="2" stroke-linejoin="round"/>';
  return s;
}
/* ---------- Today: plans and the record of days ---------- */
function plans(){if(!Array.isArray(S.plans))S.plans=[];return S.plans;}
function dkey(d){var x=new Date(d);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2);}
function todayKey(){return dkey(Date.now());}
function tomorrowKey(){return dkey(Date.now()+86400000);}
function niceDate(k){
  var p=k.split('-');
  try{return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});}catch(e){return k;}
}
function isClosed(pl){return !!pl.closed||pl.date<todayKey();}
/* the plan in front of you for a day: the latest one made for it that has not been finished */
function planFor(key){
  var c=plans().filter(function(x){return x.date===key&&!x.closed;});
  c.sort(function(a,b){return (a.created||'')<(b.created||'')?-1:1;});
  return c.length?c[c.length-1]:null;
}
function resolveItem(it){
  var t=task(it.tid);
  if(!t)return {text:it.text||'(removed)',parent:it.parent||'',done:false,gone:true,doneAt:null};
  var par=isChild(t)?task(t.parent):null,a=t.activityId?act(t.activityId):null;
  return {text:t.text,parent:par?par.text:'',sub:(!par&&a)?a.name:'',done:!!t.done,doneAt:t.done,gone:false};
}
function mkItem(kind,tid,pid){
  var id=pid||tid,t=task(id);if(!t)return null;
  var par=isChild(t)?task(t.parent):null;
  return {k:kind,tid:id,text:t.text,parent:par?par.text:''};
}
function newPlan(date,mode,items){
  var pl={id:uid(),date:date,mode:mode,items:items,closed:null,note:{tags:[],text:''},created:iso(),updated:iso()};
  plans().push(pl);return pl;
}
function touchPlan(pl){pl.updated=iso();commit();}
function tickItem(it){toggle(it.tid);}
function inPlan(pl,tid){return pl.items.some(function(x){return x.tid===tid;});}

/* the simple rules for Automatic: the big job touched most recently gives its next undone part,
   and the first five little jobs in your own order that show in Master tasks give the rest */
function lastTouched(t){
  var m=t.updated||t.created||'';
  partsOf(t).forEach(function(p){if((p.updated||'')>m)m=p.updated;});
  return m;
}
function bigCandidates(){
  return S.tasks.filter(function(t){
    if(t.done||!isBig(t)||isChild(t))return false;
    var ks=childrenOf(t);
    return !ks.length||ks.some(function(p){return !p.done;});
  });
}
/* Automatic takes the FIRST big task in the owner's own order (set by dragging on the Big page) */
function autoItems(){
  var out=[],best=bigCandidates()[0];
  if(best){
    var p=partsOf(best).find(function(x){return !x.done;});
    out.push(p?mkItem('big',best.id,p.id):mkItem('big',best.id));
  }
  smallRows().filter(function(r){return !isBig(r.t)&&!(r.owner!==r.t&&isBig(r.owner));}).slice(0,5).forEach(function(r){out.push(mkItem('little',r.t.id));});
  return out.filter(Boolean);
}
function littleChoices(pl,cust){
  var jobs=[],parts=[];
  S.tasks.forEach(function(t){
    if(t.done||isBig(t))return;
    var par=isChild(t)?task(t.parent):null;
    if(par&&isBig(par))return;
    var v=par?'P:'+par.id+':'+t.id:'T:'+t.id;
    var taken=pl?inPlan(pl,t.id):(cust&&cust.littles.indexOf(v)>-1);
    if(taken)return;
    if(par)parts.push({v:v,label:t.text+' (subtask of '+par.text+')'});else jobs.push({v:v,label:t.text});
  });
  return {jobs:jobs,parts:parts};
}
function itemFromValue(v,kind){
  var a=v.split(':');
  return a[0]==='T'?mkItem(kind,a[1],null):mkItem(kind,a[1],a[2]);
}
function choiceSelect(label,ch,extra){
  var sel=h('select',{class:'sel','aria-label':label},[h('option',{value:'',text:extra||'Choose…'})]);
  if(ch.jobs.length){var g=h('optgroup',{label:'Small'});ch.jobs.forEach(function(o){g.appendChild(h('option',{value:o.v,text:o.label}));});sel.appendChild(g);}
  if(ch.parts.length){var g2=h('optgroup',{label:'Subtasks of small tasks'});ch.parts.forEach(function(o){g2.appendChild(h('option',{value:o.v,text:o.label}));});sel.appendChild(g2);}
  return sel;
}

function setSize(t,big){if(big)t.size='big';else delete t.size;t.updated=iso();}

/* ---------- actions ---------- */
function addTask(text,activityId){
  text=(text||'').trim();if(!text)return false;
  S.tasks.unshift({id:uid(),text:text,activityId:activityId||null,created:iso(),done:null,updated:iso()});
  commit();return true;
}
/* Adds several new tasks at the top, in the order given. Nothing existing is touched; if that cannot be shown, nothing is added. */
function addMany(text,actId,quiet,big){
  if(actId&&!act(actId))return {error:true};
  var lines=text.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
  var have={};
  S.tasks.forEach(function(t){if((t.activityId||null)===(actId||null))have[t.text.trim().toLowerCase()]=1;});
  var fresh=[],skipped=0,now=iso();
  lines.forEach(function(x){
    var k=x.toLowerCase();
    if(have[k]){skipped++;return;}
    have[k]=1;
    var nt={id:uid(),text:x,activityId:actId||null,created:now,done:null,updated:now};
    if(quiet&&actId)nt.nm=true;
    if(big)nt.size='big';
    fresh.push(nt);
  });
  var before=JSON.stringify(S.tasks),n=S.tasks.length;
  S.tasks=fresh.concat(S.tasks);
  if(S.tasks.length!==n+fresh.length||JSON.stringify(S.tasks.slice(fresh.length))!==before){S.tasks=JSON.parse(before);return {error:true};}
  if(fresh.length)commit();
  return {added:fresh.length,skipped:skipped};
}
/* hide or show every open task of one activity in Master tasks */
function setActivityMaster(actId,show){
  var now=iso();
  S.tasks.forEach(function(t){
    if(t.activityId!==actId||t.done)return;
    if(show){if(t.nm){delete t.nm;t.updated=now;}}
    else if(!t.nm){t.nm=true;t.updated=now;}
  });
  commit();
}
function toggle(id){
  var t=task(id);if(!t)return;
  if(t.done){t.done=null;if(ui.lastTicked===id)ui.lastTicked=null;}
  else{t.done=iso();ui.lastTicked=id;}
  t.updated=iso();
  commit();
}
function restore(id){var t=task(id);if(t){t.done=null;t.updated=iso();}ui.lastTicked=null;commit();}
function createActivity(name){
  name=(name||'').trim();if(!name)return null;
  var a={id:uid(),name:name,created:iso(),archived:null,updated:iso()};
  S.activities.push(a);return a;
}
function openActivity(id){ui.view='activity';ui.activityId=id;ui.lastActivityId=id;ui.sheet=null;render();}
var MAIN={today:1,master:1,small:1,big:1,activities:1};
function go(view){ui.view=view;ui.sheet=null;if(MAIN[view])ui.back=[];render();}
/* open a page that sits on top of the one you were on (Settings, Archive, Sync) so Back returns to it */
function goSub(view){
  ui.back=ui.back||[];
  ui.back.push({view:ui.view,activityId:ui.activityId});
  ui.view=view;ui.sheet=null;render();
}
function goBack(){
  var b=(ui.back||[]).pop();
  if(!b){go('today');return;}
  ui.view=b.view;if(b.activityId)ui.activityId=b.activityId;ui.sheet=null;render();
}
function archiveActivity(id){
  var a=act(id);if(!a)return;
  a.archived=iso();a.updated=iso();
  if(ui.lastActivityId===id)ui.lastActivityId=null;
  ui.view='activities';commit();
}
function unarchive(id){var a=act(id);if(a){a.archived=null;a.updated=iso();}commit();}
function closeSheet(){ui.sheet=null;ui.afterCreate=null;render();}

/* ---------- views ---------- */
var app=document.getElementById('app');

function lastAct(){
  var a=act(ui.lastActivityId);
  if(a&&!a.archived)return a;
  var l=live();return l.length?l[l.length-1]:null;
}

function appHeader(){
  return h('div',{class:'apphead'},[h('p',{class:'brand',text:'Get a grip (preview)'}),
    h('button',{class:'menubtn','aria-label':'More: Archive and Settings',onclick:function(){ui.sheet={type:'menu'};render();}},
      [svg('<circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>',26)])]);
}
function titleBar(title,tools){return h('div',{class:'topbar'},[h('h2',{class:'title',text:title})].concat(tools||[]));}

/* the row at the top of an activity page: the activity's name (tap to switch) and a new-activity button */
function topbar(){
  var a=act(ui.activityId);
  var kids=[];
  if(a){
    kids.push(h('button',{class:'btn tab on','aria-label':'Switch activity: '+a.name,onclick:function(){ui.sheet={type:'switch'};render();}},
      [h('span',{text:a.name}),svg(ICON.down,18)]));
  }
  kids.push(h('button',{class:'btn icon','aria-label':'New activity',onclick:function(){ui.afterCreate='open';ui.sheet={type:'new'};render();}},[svg(ICON.plus)]));
  return h('div',{class:'topbar'},kids);
}

/* the bottom bar: three buttons now. Labels wrap, and if more buttons are ever added it scrolls sideways
   with a small arrow at each end that shows only when there is more that way */
var NAVS=[['today','Today'],['big','Big'],['small','Small'],['master','Master tasks'],['activities','Activities']];
function navBar(cur){
  var sc=h('div',{class:'navscroll'},NAVS.map(function(n){
    return h('button',{'aria-current':n[0]===cur?'page':null,onclick:function(){go(n[0]);}},[h('span',{text:n[1]})]);
  }));
  var left=h('button',{class:'navarrow',hidden:true,'aria-label':'Show buttons to the left',onclick:function(){sc.scrollBy({left:-160});}},[svg('<path d="M15 6l-6 6 6 6"/>',22)]);
  var right=h('button',{class:'navarrow',hidden:true,'aria-label':'Show buttons to the right',onclick:function(){sc.scrollBy({left:160});}},[svg(ICON.right,22)]);
  function sync(){
    var over=sc.scrollWidth>sc.clientWidth+2;
    left.hidden=!over||sc.scrollLeft<=2;
    right.hidden=!over||sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-2;
  }
  sc.addEventListener('scroll',sync);
  setTimeout(function(){
    var cb=sc.querySelector('[aria-current]');
    if(cb&&cb.scrollIntoView)cb.scrollIntoView({block:'nearest',inline:'nearest'});
    sync();
  },0);

/* turns web addresses and phone numbers in a note into tappable links; everything else stays plain text */
function richText(str){
  var out=[],re=/(https?:\/\/[^\s<>]+|www\.[^\s<>]+)|(\+?\d[\d ().-]{7,}\d)/gi,last=0,m;
  while((m=re.exec(str))){

      var tr=s.match(/[.,;:!?)\]'"”’]+$/);
      if(tr){s=s.slice(0,-tr[0].length);re.lastIndex=m.index+s.length;}
      out.push(h('a',{href:/^www\./i.test(s)?'https://'+s:s,target:'_blank',rel:'noopener noreferrer',text:s}));
    }else{

var G={token:null,exp:0,status:'idle',err:'',lists:[],busy:false,plan:null,pending:null,running:false,again:false};

function cfg(){

function ago(d){
  if(!d)return 'never';
  var s=Math.max(0,Math.round((Date.now()-new Date(d).getTime())/1000));
  if(s<45)return 'just now';
  var m=Math.round(s/60);if(m<60)return m+(m===1?' minute':' minutes')+' ago';
  var hr=Math.round(m/60);if(hr<24)return hr+(hr===1?' hour':' hours')+' ago';
  var dd=Math.round(hr/24);return dd+(dd===1?' day':' days')+' ago';

/* a redraw that never touches a text box someone may be typing in: the add or search box stays put and

function softRender(){
  var ae=document.activeElement;
  if(ui.dragging||ui.sheet){ui.dirty=true;return;}
  if(ae&&app.contains(ae)&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')){
    var keep=ae.closest('.addwrap');
    if(keep&&keep.parentNode===app&&patchAround(keep))return;

function patchAround(keep){
  var kids=viewKids(),idx=-1;
  kids.forEach(function(k,i){if(k.classList&&k.classList.contains('addwrap'))idx=i;});
  if(idx<0)return false;
  var sc=app.querySelector('.list'),st=sc?sc.scrollTop:0;
  while(keep.previousSibling)app.removeChild(keep.previousSibling);
  while(keep.nextSibling)app.removeChild(keep.nextSibling);
  kids.slice(0,idx).forEach(function(k){app.insertBefore(k,keep);});
  kids.slice(idx+1).forEach(function(k){app.appendChild(k);});
  var l=app.querySelector('.list');if(l)l.scrollTop=st;

}
function commitSync(){commit(true);}

/* sign-in: a quiet request first (prompt none); a tap is needed if Google wants to show something */
function needScopes(extra){

  if(c.enabled&&c.listId)a.push(SCOPE);

  var need=needScopes(extra);
  if(tokenValid(need))return Promise.resolve(G.token);
  /* No quiet renewal: on the owner's phone and laptop Google refused it every time (popup_failed_to_open, popup_closed),
     and an unanswered one froze the sync, so without a valid pass the app simply asks for a tap */
  if(!interactive)return Promise.reject({type:'quiet'});
  var pr=new Promise(function(res,rej){
    var cid=getCid();
    if(!cid){rej({type:'noclient'});return;}
    var timer=setTimeout(function(){fail('timeout');},interactive?120000:20000);
    function fail(t){clearTimeout(timer);if(!interactive)silentFailAt=Date.now();rej({type:t});}
    function start(){
      try{
        var tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:need.join(' '),
          callback:function(r){
            if(r&&r.access_token){silentFailAt=0;clearTimeout(timer);D.user=null;G.token=r.access_token;G.tokScope=need;G.exp=Date.now()+(r.expires_in||3600)*1000;res(G.token);}
            else fail((r&&r.error)||'denied');

          error_callback:function(e){fail((e&&e.type)||'blocked');}});
        /* Google's window opening and closing makes the page lose and regain focus; ignore that for a few seconds */
        askingUntil=Date.now()+6000;

      }catch(e){fail('start');}
    }
    if(gisReady&&window.google&&google.accounts){start();return;}
    loadGIS();
    var n=0,iv=setInterval(function(){
      if(gisReady&&window.google&&google.accounts){clearInterval(iv);start();}
      else if(++n>40){clearInterval(iv);fail('load');}
    },250);

function gcall(method,url,body){
  var o={method:method,headers:{Authorization:'Bearer '+G.token}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  return fetch(url,o).then(function(r){
    if(r.status===401){G.token=null;var e=new Error('Your Google sign-in has expired.');e.auth=true;throw e;}
    if(r.status===404&&method==='DELETE')return null;
    if(!r.ok){var e2=new Error('Google said '+r.status+(r.status===403?'. Check that the Google Tasks API is switched on and that you approved the permission to change tasks.':'.'));throw e2;}
    return r.status===204?null:r.json();

function fetchAll(listId){

    return gcall('GET',u).then(function(d){all=all.concat(d.items||[]);return d.nextPageToken?page(d.nextPageToken):all;});

/* how a task looks in Google: its text is the title; the notes start with an "Activity:" line, then the details */
function composeNotes(t){
  var a=t.activityId?act(t.activityId):null,d=(t.notes||'').trim(),p=[];
  if(a)p.push('Activity: '+a.name);

}
function parseNotes(n){
  n=(n||'').replace(/\r\n/g,'\n');
  var m=n.match(/^Activity: ([^\n]*)(?:\n\n?|$)/);
  if(m)return {activity:m[1].trim(),details:n.slice(m[0].length).trim()};
  return {activity:null,details:n.trim()};
}
function appRepr(t){return {title:t.text,notes:composeNotes(t),done:!!t.done};}
function gRepr(g){return {title:(g.title||'').trim(),notes:(g.notes||'').replace(/\r\n/g,'\n').trim(),done:g.status==='completed'};}
function findAct(name){
  var n=name.toLowerCase();
  function same(a){return a.name.toLowerCase()===n;}
  return live().filter(same)[0]||archived().filter(same)[0]||null;

function linkOf(t,pre){
  if(t.sid&&t.sid.indexOf(pre)===0)return t.sid.slice(pre.length);
  if(t.gid&&t.gid.indexOf(pre)===0)return t.gid.slice(pre.length);
  return null;

function applyPull(t,g,f){
  if(f==='title'){var v=(g.title||'').trim();if(v)t.text=v;}
  else if(f==='notes'){
    var p=parseNotes(g.notes);
    if(p.details)t.notes=p.details;else delete t.notes;
    if(p.activity){var a=findAct(p.activity);if(a)t.activityId=a.id;}
  }else if(f==='done'){t.done=g.status==='completed'?(g.completed||iso()):null;}
}

/* work out what a sync would do, without doing it */
function buildPlan(gtasks){
  var c=cfg(),L=c.listId,pre=L+':',toG=c.dir!=='toApp',toA=c.dir!=='toGoogle';
  var gmap={},seen={},tomb={},recreate=[];
  gtasks.forEach(function(g){gmap[g.id]=g;});
  S.deleted.forEach(function(d){if(d.gid.indexOf(pre)===0)tomb[d.gid.slice(pre.length)]=d;});
  var P={merge:[],ins:[],news:[],del:{app:[],google:[]},n:{gNew:0,gEdit:0,aNew:0,aEdit:0},linked:0,stopped:false};

  S.tasks.forEach(function(t){
    var id=linkOf(t,pre);if(!id)return;
    P.linked++;
    var g=gmap[id];
    if(!g){
      if(t.done)return;
      if(c.deletes==='never'||!toA)recreate.push(t);
      else P.del.app.push(t);
      return;
    }
    seen[id]=1;
    var gr=gRepr(g),ar=appRepr(t),base=t.gs?{title:t.gs.title,notes:t.gs.notes,done:t.gs.done}:{title:gr.title,notes:gr.notes,done:gr.done};
    var gUpd=Date.parse(g.updated)||0,aUpd=Date.parse(t.updated)||0;
    var nb={title:base.title,notes:base.notes,done:base.done},patch={},pulls=[],pushed=[];
    ['title','notes','done'].forEach(function(f){
      var allowed=f==='done'?c.ticks:c.edits;
      var aC=ar[f]!==base[f],gC=gr[f]!==base[f],dec=null;
      if(aC&&gC&&ar[f]!==gr[f])dec=aUpd>gUpd?'app':'google';
      else if(aC&&!gC)dec='app';
      else if(gC&&!aC)dec='google';
      if(allowed&&dec==='app'&&toG){pushed.push(f);}
      else if(allowed&&dec==='google'&&toA){pulls.push(f);nb[f]=gr[f];}
      else if(ar[f]===gr[f]){nb[f]=ar[f];}
    });
    var tmp={title:t.text,activityId:t.activityId,notes:t.notes,done:t.done};
    pulls.forEach(function(f){applyPullTo(tmp,g,f);});
    /* after pulling notes, the app's own wording of them may differ from Google's: send that back too */
    if(pulls.indexOf('notes')>-1&&toG&&composeNotes(tmp)!==gr.notes&&pushed.indexOf('notes')<0)pushed.push('notes');
    if(pushed.length)P.n.gEdit++;
    if(pulls.length)P.n.aEdit++;
    if(!pushed.length&&!pulls.length&&t.gs&&t.sid===pre+id&&nb.title===t.gs.title&&nb.notes===t.gs.notes&&nb.done===t.gs.done)return;
    P.merge.push(function(){
      pulls.forEach(function(f){applyPull(t,g,f);});
      if(pulls.length)t.updated=g.updated;
      var fin=appRepr(t);
      pushed.forEach(function(f){
        if(f==='title')patch.title=fin.title;
        else if(f==='notes')patch.notes=fin.notes||null;
        else{patch.status=fin.done?'completed':'needsAction';if(!fin.done)patch.completed=null;}
      });
      function finish(r){
        var out=r?gRepr(r):null;

  /* tasks only in the app go up to Google (oldest first, so the newest ends up on top) */
  var ins=[];
  if(toG){
    S.tasks.forEach(function(t){
      if(t.done)return;

    if(!toA||!c.adds)return;

/* same as applyPull but onto a plain copy, used only to preview the wording */
function applyPullTo(tmp,g,f){

function runSeq(fns){return fns.reduce(function(p,f){return p.then(f);},Promise.resolve());}

function applyPlan(P,opts){

  if(hasDel&&!park){
    P.del.google.forEach(function(d){fns.push(function(){return gcall('DELETE',TB+'lists/'+enc(L)+'/tasks/'+enc(d.gid.slice(pre.length)));});});

  return runSeq(fns).then(function(){
    if(P.news.length){

        var t={id:uid(),text:gr.title,activityId:a?a.id:null,created:g.updated||iso(),done:null,sid:pre+g.id,gs:gr,updated:g.updated};

function syncNow(reason,opts){
  opts=opts||{};

  if(!c.listId)return Promise.resolve();
  if(G.running){G.again=true;return Promise.resolve();}
  if(!opts.interactive&&(reason==='change'||reason==='timer')&&G.status==='needs'&&!tokenValid(needScopes([SCOPE])))return Promise.resolve();
  G.running=true;G.err='';
  if(G.status!=='confirm')G.status='syncing';
  if(ui.view==='sync')softRender();
  return getToken(!!opts.interactive,[SCOPE]).then(function(){
    return fetchAll(c.listId);
  }).then(function(gt){
    var P=buildPlan(gt);G.plan=P;
    if(!c.confirmed&&!opts.confirm){G.status='confirm';return null;}
    return applyPlan(P,opts).then(function(){G.status='idle';});
  }).catch(function(e){
    if(e&&e.type==='noclient'){G.status='error';G.err='Add your Google client ID on the Import page first.';}
    else if(e&&(e.auth||(e.type&&!opts.interactive))){G.status='needs';G.err='';}
    else if(e&&e.type){G.status='error';G.err='Google did not give access ('+e.type+').';}
    else if(e instanceof TypeError){G.status='error';G.err='Could not reach Google. It will try again.';}

  var gone={};P.del.google.forEach(function(d){gone[d.gid]=1;});
  S.deleted=S.deleted.filter(function(d){return !gone[d.gid];});

function disconnectSync(){
  var c=cfg();c.enabled=false;c.listId='';c.listName='';c.confirmed=false;c.last=null;
  G.status='idle';G.err='';G.plan=null;G.pending=null;G.lists=[];

}
function openSync(){if(getCid())loadGIS();goSub('sync');}

  G.status='idle';G.plan=null;G.pending=null;G.err='';
  commitSync();

}
function connectForLists(){
  G.busy=true;G.err='';render();
  getToken(true,[SCOPE]).then(function(){return gcall('GET',TB+'users/@me/lists?maxResults=100');}).then(function(d){
    G.lists=d.items||[];G.busy=false;render();
  }).catch(function(e){
    G.busy=false;
    G.err=e&&e.type?(e.type==='noclient'?'Add your Google client ID on the Import page first.':'Google did not give access ('+e.type+').'):((e&&e.message)||'Could not connect.');
    render();
  });
}
function syncSummary(){
  var c=cfg(),d=dcfg(),bits=[];
  if(d.enabled)bits.push('Devices: '+(D.status==='needs'?'sign in needed':'synced '+ago(d.last)));
  if(c.enabled&&c.listId)bits.push('Google Tasks: '+(G.status==='needs'?'sign in needed':'synced '+ago(c.last)));
  return bits.length?bits.join('. '):'Keep your devices, and a Google Tasks list, in step';

function syncBanner(){
  var c=cfg(),d=dcfg();

  var needs=(tOn&&G.status==='needs')||(dOn&&D.status==='needs');
  var err=(dOn&&D.status==='error'&&D.err)||(tOn&&G.status==='error'&&G.err)||'';
  if(!needs&&!err&&!D.tapped)return null;
  var label=D.tapped?'Signing in…':(err?'Sync problem':'Tap to keep syncing');
  var detail=D.tapped?'A Google window may open. Approve it.':(err||'');

    if(D.tapped)return;

    syncAll('manual',{interactive:true}).then(done,done);

    h('div',null,[h('small',{text:'Sync'}),h('span',{text:label}),detail?h('small',{text:detail}):null]),

/* ---------- Sync between devices (a hidden file in the user's own Google Drive) ---------- */
var DRIVE='https://www.googleapis.com/auth/drive.appdata';
var DB='https://www.googleapis.com/drive/v3/';
var DU='https://www.googleapis.com/upload/drive/v3/';
var DFILE='get-a-grip-next-data.json';
/* D is runtime only; the on/off setting lives in S.drive on each device and is never shared */
var D={status:'idle',err:'',running:false,again:false,seen:null,user:null,files:[],skew:null,log:[],startedAt:0,tapped:false};
function dlog(m){D.log.push(new Date().toISOString().slice(11,19)+' '+m);if(D.log.length>16)D.log.shift();}
function dcfg(){
  cfg();
  if(!S.drive)S.drive={};
  if(S.drive.enabled===undefined)S.drive.enabled=false;
  if(S.drive.confirmed===undefined)S.drive.confirmed=false;
  if(S.drive.last===undefined)S.drive.last=null;
  return S.drive;
}
function stable(o){
  return JSON.stringify(o,function(k,v){
    if(v&&typeof v==='object'&&!Array.isArray(v)){var s={};Object.keys(v).sort().forEach(function(x){s[x]=v[x];});return s;}
    return v;
  });
}
/* what is shared: activities, tasks, a note of deletions and when each list was last reordered.
   Settings, tokens and the Google Tasks links of the other sync stay on the device. */
function stripGs(t){if(!t||t.gs===undefined)return t;var c=Object.assign({},t);delete c.gs;return c;}
function toDoc(st){
  return JSON.parse(JSON.stringify({v:2,activities:st.activities,tasks:st.tasks.map(stripGs),gone:st.gone||[],ord:st.ord||{t:'',a:''},plans:st.plans||[]}));
}
function stampOf(x){return x.updated||x.created||'';}
var lastAlias={};
function mergeDocs(L,R){
  R=Object.assign({},R,{tasks:(R.tasks||[]).map(stripGs)});
  var cutoff=new Date(Date.now()-90*86400000).toISOString();
  var gone={};
  (L.gone||[]).concat(R.gone||[]).forEach(function(g){if(!gone[g.id]||gone[g.id]<g.at)gone[g.id]=g.at;});

  /* activities: the later change wins. Two with the same name (and the same archived state) are one activity;
     both devices keep the older of the two, so they settle on the same one. */
  var lA={},byKey={},acts={},alias={};
  function key(a){return a.name.toLowerCase()+'|'+(a.archived?1:0);}
  (L.activities||[]).forEach(function(a){lA[a.id]=a;acts[a.id]=a;byKey[key(a)]=a;});
  (R.activities||[]).forEach(function(r){
    var l=lA[r.id];
    if(l){if(stampOf(r)>stampOf(l))acts[l.id]=Object.assign({},r);return;}
    var same=byKey[key(r)];
    if(!same||!acts[same.id]){acts[r.id]=r;byKey[key(r)]=r;return;}
    var cur=acts[same.id];
    var older=((cur.created||'')<(r.created||'')||((cur.created||'')===(r.created||'')&&cur.id<r.id))?cur:r,other=older===cur?r:cur;
    var latest=stampOf(r)>stampOf(cur)?r:cur;
    var merged=Object.assign({},latest,{id:older.id,created:older.created||latest.created});
    delete acts[cur.id];acts[older.id]=merged;alias[other.id]=older.id;byKey[key(merged)]=merged;
  });
  lastAlias=alias;
  function realias(t){return alias[t.activityId]?Object.assign({},t,{activityId:alias[t.activityId]}):t;}

  /* tasks: the later change wins; the Google Tasks link stays as this device has it */
  var lT={},tasks={};
  (L.tasks||[]).forEach(function(t0){var t=realias(t0);lT[t.id]=t;tasks[t.id]=t;});
  (R.tasks||[]).forEach(function(r0){
    var r=realias(r0);
    var l=lT[r.id];
    if(!l){tasks[r.id]=r;return;}
    if(stampOf(r)>stampOf(l)){
      var w=Object.assign({},r);
      if(l.sid){w.sid=l.sid;w.gs=l.gs;}
      tasks[r.id]=w;
    }else if(!l.sid&&r.sid){tasks[r.id]=Object.assign({},l,{sid:r.sid});}
  });
  /* a deletion stands unless the task was changed after it was deleted */
  Object.keys(tasks).forEach(function(id){if(gone[id]&&gone[id]>=stampOf(tasks[id]))delete tasks[id];});
  var goneList=Object.keys(gone).filter(function(id){return !tasks[id]&&gone[id]>cutoff;}).map(function(id){return {id:id,at:gone[id]};});
  /* two tasks pointing at the same Google task are one task */
  var bySid={};
  Object.keys(tasks).forEach(function(id){
    var t=tasks[id];if(!t||!t.sid)return;
    var o=bySid[t.sid];
    if(!o){bySid[t.sid]=t;return;}
    var keep=stampOf(t)>stampOf(o)?t:o,drop=keep===t?o:t;
    delete tasks[drop.id];goneList.push({id:drop.id,at:new Date().toISOString()});bySid[t.sid]=keep;
  });
  goneList.sort(function(a,b){return a.id<b.id?-1:a.id>b.id?1:0;});

  /* order: whichever device reordered last decides; tasks the other side has that this one lacks go on top, new activities at the end */
  var lOrd=L.ord||{},rOrd=R.ord||{};
  function idsOf(list){return (list||[]).map(function(x){return x.id;}).join(',');}
  var tWin=(lOrd.t||'')>(rOrd.t||'')||((lOrd.t||'')===(rOrd.t||'')&&idsOf(L.tasks)>=idsOf(R.tasks));
  var aWin=(lOrd.a||'')>(rOrd.a||'')||((lOrd.a||'')===(rOrd.a||'')&&idsOf(L.activities)>=idsOf(R.activities));
  function order(win,lose,items,top){
    var seen={},base=[],extra=[];
    (win||[]).forEach(function(x){var id=alias[x.id]||x.id;if(items[id]&&!seen[id]){seen[id]=1;base.push(id);}});
    (lose||[]).forEach(function(x){var id=alias[x.id]||x.id;if(items[id]&&!seen[id]){seen[id]=1;extra.push(id);}});
    Object.keys(items).forEach(function(id){if(!seen[id]){seen[id]=1;extra.push(id);}});
    return (top?extra.concat(base):base.concat(extra)).map(function(id){return items[id];});
  }
  /* plans and day records: the later change wins, a deletion stands unless the plan changed after it */
  var pl={};
  (L.plans||[]).forEach(function(x){pl[x.id]=x;});
  (R.plans||[]).forEach(function(x){var l=pl[x.id];if(!l||stampOf(x)>stampOf(l))pl[x.id]=x;});
  Object.keys(pl).forEach(function(id){if(gone[id]&&gone[id]>=stampOf(pl[id]))delete pl[id];});
  var planList=Object.keys(pl).map(function(id){return pl[id];}).sort(function(a,b){return (a.created||'')<(b.created||'')?-1:(a.created||'')>(b.created||'')?1:(a.id<b.id?-1:1);});
  goneList=goneList.filter(function(g){return !pl[g.id];});
  return {v:2,plans:planList,
    activities:order(aWin?L.activities:R.activities,aWin?R.activities:L.activities,acts,false),
    tasks:order(tWin?L.tasks:R.tasks,tWin?R.tasks:L.tasks,tasks,true),
    gone:goneList,
    ord:{t:(lOrd.t||'')>(rOrd.t||'')?(lOrd.t||''):(rOrd.t||''),a:(lOrd.a||'')>(rOrd.a||'')?(lOrd.a||''):(rOrd.a||'')}};
}
function applyMerged(doc){
  cfg();
  if(stable(toDoc(S))===stable(doc))return false;
  var have={};doc.tasks.forEach(function(t){have[t.id]=1;});
  Object.keys(ui.open).forEach(function(id){if(!have[id])delete ui.open[id];});
  Object.keys(ui.partsOpen).forEach(function(id){if(!have[id])delete ui.partsOpen[id];});
  Object.keys(ui.bigCards).forEach(function(id){if(!have[id])delete ui.bigCards[id];});
  if(ui.lastTicked&&!have[ui.lastTicked])ui.lastTicked=null;
  ['pick','activityId','lastActivityId'].forEach(function(k){if(ui[k]&&lastAlias[ui[k]])ui[k]=lastAlias[ui[k]];});
  var gsKeep={};S.tasks.forEach(function(t){if(t.gs)gsKeep[t.id]=t.gs;});
  doc.tasks.forEach(function(t){if(!t.gs&&gsKeep[t.id])t.gs=gsKeep[t.id];});
  S.activities=doc.activities;S.tasks=doc.tasks;S.gone=doc.gone;S.ord=doc.ord;S.plans=doc.plans||[];migrateParts();
  return true;
}

/* Drive transport */
function dfetch(method,url,headers,body){
  var o={method:method,headers:Object.assign({Authorization:'Bearer '+G.token},headers||{})};
  if(body!==undefined)o.body=body;
  return fetch(url,o).then(function(r){
    if(r.status===401){G.token=null;var e=new Error('Your Google sign-in has expired.');e.auth=true;throw e;}
    if(!r.ok)throw new Error('Google Drive said '+r.status+(r.status===403?'. Check that the Google Drive API is switched on and that you approved the Drive permission.':'.'));
    return r;
  });
}
function dfind(){
  return dfetch('GET',DB+'files?spaces=appDataFolder&orderBy=createdTime&pageSize=20&q='+enc("name='"+DFILE+"' and trashed=false")+'&fields='+enc('files(id,version,createdTime,modifiedTime)'))
    .then(function(r){return r.json();}).then(function(d){D.files=d.files||[];return D.files[0]||null;});
}
function dread(id){
  return dfetch('GET',DB+'files/'+enc(id)+'?alt=media').then(function(r){return r.text();}).then(function(t){
    var d;try{d=JSON.parse(t);}catch(e){throw new Error('The data saved in Google Drive could not be read.');}
    if(!d||!Array.isArray(d.activities)||!Array.isArray(d.tasks))throw new Error('The data saved in Google Drive is not in the expected format.');
    if(d.v>2)throw new Error('The data in Google Drive was written by a newer version of the app. Reload the app to update it.');
    return d;
  });
}
function dversion(id){return dfetch('GET',DB+'files/'+enc(id)+'?fields=version').then(function(r){return r.json();}).then(function(d){return d.version;});}
function dcreate(doc){
  var bd='gag'+Date.now();
  var body='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:DFILE,parents:['appDataFolder']})+
    '\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(doc)+'\r\n--'+bd+'--';
  return dfetch('POST',DU+'files?uploadType=multipart&fields=id,version,modifiedTime',{'Content-Type':'multipart/related; boundary='+bd},body);
}
function dupdate(id,doc){
  return dfetch('PATCH',DU+'files/'+enc(id)+'?uploadType=media&fields=id,version,modifiedTime',{'Content-Type':'application/json'},JSON.stringify(doc));
}
/* read, merge, save. If someone else saved in between, start again (up to three times). */
function ensureUser(){
  if(D.user!==null)return Promise.resolve();

  sel=sel||'.row';apply=apply||applyOrder;
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;
  e.preventDefault();
  var list=e.currentTarget.closest(sel).parentNode,ids=rowIds(list,sel),i=ids.indexOf(id),j=i+(e.key==='ArrowUp'?-1:1);
  if(i<0||j<0||j>=ids.length)return;
  ids.splice(i,1);ids.splice(j,0,id);
  apply(ids);ui.focusHandle=id;commit();
}

/* swipe between pages: Today | Big | Small | Master tasks | Activities (an activity page swipes back to Activities) */
var tx=0,ty=0,tracking=false;
document.addEventListener('touchstart',function(e){
  if(ui.sheet||e.touches.length!==1){tracking=false;return;}
  var tg=e.target;if(tg.closest&&tg.closest('input,select,textarea,.handle,.navscroll'))return;
  tracking=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!tracking)return;tracking=false;
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
  var left=dx<0,order=['today','big','small','master','activities'];
  if(ui.view==='activity'){if(!left)go('activities');return;}
  var i=order.indexOf(ui.view);
  if(i<0)return;
  var j=i+(left?1:-1);
  if(j>=0&&j<order.length)go(order[j]);
},{passive:true});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet();});

if(migrateParts()){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
render();
(function(){
  var c=cfg(),d=dcfg(),hadCid=d.cid;
  if(checkSignIn()||d.cid!==hadCid)commit(true);
  if((c.enabled&&c.listId)||d.enabled){
    if(getCid())loadGIS();
    if(c.auto&&anySync())setTimeout(function(){syncAll('open');},800);
  }
  function lastAny(){var k=cfg(),dd=dcfg();return Math.max(k.last?Date.parse(k.last):0,dd.last?Date.parse(dd.last):0);}
  setInterval(function(){
    var k=cfg();
    if(!k.auto||!anySync()||!k.interval||document.visibilityState!=='visible')return;
    if(Date.now()-lastAny()>=k.interval*60000-5000)syncAll('timer');
  },30000);
  document.addEventListener('visibilitychange',function(){
    var k=cfg();
    if(document.visibilityState!=='visible'||!k.auto||!anySync())return;
    if(Date.now()<askingUntil||G.running||D.running)return;
    if(Date.now()-lastAny()>30000)syncAll('return');
  });
  document.addEventListener('focusout',function(){
    if(ui.dirty)setTimeout(function(){if(ui.dirty)softRender();},250);
  });
})();
})();
