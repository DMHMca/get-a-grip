<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Get a grip</title>
<meta name="description" content="Get a grip: a plain to-do list with activities.">
<meta name="theme-color" content="#234E70">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Get a grip">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F2; --surface:#ffffff; --text:#1B1F1D; --muted:#5B625E;
  --line:#D9DCD8; --border:#BFC5C0; --accent:#234E70; --on-accent:#ffffff;
  --tint:#E4ECF2; --scrim:rgba(27,31,29,.5); --dot:#B5BBB6; --danger:#9B2C2C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191A; --surface:#1F2527; --text:#E8ECEA; --muted:#A0A8A4;
    --line:#2F3639; --border:#4A5357; --accent:#7FB0D6; --on-accent:#10202D;
    --tint:#22323E; --scrim:rgba(0,0,0,.6); --dot:#4A5357; --danger:#F09A9A;
  }
}
:root[data-theme="dark"]{
  --bg:#15191A; --surface:#1F2527; --text:#E8ECEA; --muted:#A0A8A4;
  --line:#2F3639; --border:#4A5357; --accent:#7FB0D6; --on-accent:#10202D;
  --tint:#22323E; --scrim:rgba(0,0,0,.6); --dot:#4A5357; --danger:#F09A9A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:17px;-webkit-text-size-adjust:100%}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.btn{flex:none;height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--border);background:transparent;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.danger{border-color:var(--danger);color:var(--danger);font-weight:700}
.btn.icon{width:44px;padding:0}
.tab{flex:1;min-width:0;justify-content:space-between;text-align:left;padding:0 10px 0 14px}
.tab span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{flex:1;margin:0;font-size:20px;font-weight:700}
.brand{flex:none;margin:0;padding:12px 16px 0;font-size:14px;line-height:1.2;font-weight:700;letter-spacing:.02em;color:var(--accent)}
.brand + .topbar{padding-top:6px}
.addwrap{padding:8px 16px 0}
.addbox{display:flex;align-items:center;height:56px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:0 6px 0 16px;gap:8px}
.addbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:17px;color:var(--text);height:48px}
.addbox input:focus-visible{outline:0}
.addbox:focus-within{border-color:var(--accent)}
.addbox .go{flex:none;width:44px;height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;padding:0}
.chip{margin-top:8px;height:40px;padding:0 12px;border-radius:10px;border:1.5px solid var(--border);background:transparent;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip b{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 8px}
.meta .count{font-size:15px;color:var(--muted)}
.meta .acts{display:flex;gap:8px}
.list{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.row{display:flex;flex-wrap:wrap;align-items:center;min-height:60px;padding:0 4px 0 4px;border-bottom:1px solid var(--line)}
.tick{flex:none;width:48px;height:48px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.rowtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:8px 0;text-align:left;background:none;border:0;font-size:17px;line-height:1.3;color:var(--text);overflow-wrap:anywhere}
.rowtext small{font-size:14px;color:var(--muted)}
.more{flex:none;width:44px;height:48px;border:0;background:none;padding:0;color:var(--muted);display:flex;align-items:center;justify-content:center}
.more[aria-expanded="true"]{color:var(--accent)}
.details{flex:0 0 100%;padding:0 52px 12px 48px;font-size:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.details a{color:var(--accent);text-decoration:underline}
.field textarea{width:100%;min-height:96px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:16px;line-height:1.4;padding:12px 14px;resize:vertical}
.field textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row.done .rowtext{color:var(--muted);text-decoration:line-through}
.empty{padding:28px 20px;color:var(--muted);line-height:1.45}
.strip{margin:8px 16px 0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 16px}
.strip div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.strip small{font-size:14px;color:var(--muted)}
.strip span{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.nav{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface);margin-top:8px}
.nav button{flex:1;min-width:0;height:56px;border:0;border-top:3px solid transparent;background:transparent;font-size:14px;color:var(--muted);padding:0 8px;display:flex;align-items:center;justify-content:center}
.nav button span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700;border-top-color:var(--accent);background:var(--tint)}
.handle{flex:none;width:44px;height:48px;border:0;background:none;padding:0;color:var(--muted);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.row.dragging,.arow.dragging{position:relative;z-index:5;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:12px}
.arow{display:flex;align-items:center;border-bottom:1px solid var(--line);padding-right:4px}
.arow .navrow{border-bottom:0;flex:1;min-width:0;width:auto}
.navrow{display:flex;width:100%;align-items:center;gap:12px;min-height:68px;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:17px}
.navrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.navrow b{font-weight:700;overflow-wrap:anywhere}
.navrow small{font-size:14px;color:var(--muted)}
.navrow.static{cursor:default}
.pad{padding:0 16px 16px}
.pad .btn{width:100%;height:52px;font-size:17px}
.sect{margin:0;padding:16px 16px 0;font-size:17px;font-weight:700}
.adv{border-top:1px solid var(--line);margin-top:12px}
.adv summary{cursor:pointer;padding:14px 16px;font-size:17px;font-weight:700;min-height:48px}
.adv summary:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.foot a{color:var(--accent)}
.pad.two{display:flex;gap:8px}
.pad.two .btn{flex:1;width:auto;min-width:0;padding:0 8px}
.sorts{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
.sorts .btn{height:40px;font-size:15px;padding:0 12px}
.sorts .btn[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);font-weight:700}
.hit{font-size:14px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.foot{padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.4}
.foot button{background:none;border:0;padding:0;color:var(--accent);font-size:14px;text-decoration:underline}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 0 calc(20px + env(safe-area-inset-bottom,0px));max-height:82%;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 8px}
.sheet h2{margin:0;padding:8px 20px;font-size:17px;font-weight:700}
.opt{display:flex;width:100%;align-items:center;gap:12px;min-height:56px;padding:0 20px 0 54px;border:0;background:transparent;text-align:left;font-size:17px}
.opt span.l{flex:1;min-width:0;overflow-wrap:anywhere}
.opt small{font-size:14px;color:var(--muted)}
.opt.sel{background:var(--tint);font-weight:700;padding-left:20px}
.opt.link{padding-left:20px;font-weight:700;color:var(--accent)}
.sep{margin:6px 20px 0;border-top:1px solid var(--line)}
.field{padding:8px 20px 0;display:flex;flex-direction:column;gap:12px}
.field input[type=text],.field select{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:17px;padding:0 14px}
.field label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.field .btns{display:flex;gap:8px}
.field .btns .btn{flex:1;height:48px}
.txt{width:100%;height:52px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:16px;padding:0 14px}
.sel{width:100%;height:40px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:15px;padding:0 10px;margin-top:6px}
.note{margin:0;padding:12px 16px;color:var(--muted);line-height:1.45;font-size:15px}
.err{padding:8px 16px;color:var(--danger);font-size:15px;line-height:1.4}
.ok{padding:8px 16px;color:var(--accent);font-size:15px;font-weight:700}
.bar{flex:none;display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface)}
.bar .btn{flex:1;min-width:0;height:48px;padding:0 8px;font-size:15px}
.bar .btn[disabled]{opacity:.45}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent)}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- state ---------- */
var KEY='tasks.v1';
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function iso(){return new Date().toISOString();}
function seed(){
  return {v:1,updatedAt:0,activities:[],tasks:[]};
}
function loadLocal(){
  try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&s.activities&&s.tasks)return s;}}catch(e){}
  return null;
}
var S=loadLocal()||seed();

var ui={view:'master',activityId:null,lastActivityId:null,sheet:null,draft:'',pick:null,lastTicked:null,
  q:'',sort:'archived',rev:false,editId:null,afterCreate:null,status:'device',open:{},dirty:false,dragging:false};

/* ---------- persistence ---------- */
function commit(fromSync){
  S.updatedAt=Date.now();
  var ok=true;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){ok=false;}
  ui.status=ok?'device':'failed';
  if(fromSync===true){softRender();}else{render();scheduleSync();}
}
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}

/* ---------- helpers ---------- */
function act(id){return S.activities.find(function(a){return a.id===id;})||null;}
function task(id){return S.tasks.find(function(t){return t.id===id;})||null;}
function live(){return S.activities.filter(function(a){return !a.archived;});}
function archived(){return S.activities.filter(function(a){return a.archived;});}
function tasksOf(id){return S.tasks.filter(function(t){return t.activityId===id;});}
function openCount(id){return tasksOf(id).filter(function(t){return !t.done;}).length;}
function fmt(d){try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return '';}}
function summary(a){
  var ts=tasksOf(a.id),o=ts.filter(function(t){return !t.done;}).length,d=ts.length-o;
  if(!ts.length)return 'No tasks yet';
  if(!o)return 'All '+ts.length+' done';
  return o+' open, '+(d?d+' done':'none done');
}
function svg(inner,size,extra){
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',size||22);s.setAttribute('height',size||22);s.setAttribute('viewBox','0 0 24 24');
  s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2.3');
  s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');
  s.style.flex='none';
  s.innerHTML=inner;return s;
}
var ICON={
  plus:'<path d="M12 5v14M5 12h14"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  right:'<path d="M9 6l6 6-6 6"/>',
  box:'<path d="M3 5h18v4H3zM5 9v10h14V9M10 13h4"/>',
  list:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  chevup:'<path d="M6 15l6-6 6 6"/>'
};
function h(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k];
    if(v===null||v===undefined||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  (kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function tickIcon(done){
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('width',26);s.setAttribute('height',26);s.setAttribute('viewBox','0 0 26 26');s.setAttribute('aria-hidden','true');
  s.innerHTML=done
    ?'<circle cx="13" cy="13" r="12" fill="var(--accent)"/><path d="M7.5 13.5l4 4 7-8" fill="none" stroke="var(--on-accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'
    :'<circle cx="13" cy="13" r="11" fill="none" stroke="var(--text)" stroke-width="2"/>';
  return s;
}

/* ---------- actions ---------- */
function addTask(text,activityId){
  text=(text||'').trim();if(!text)return false;
  S.tasks.unshift({id:uid(),text:text,activityId:activityId||null,created:iso(),done:null,updated:iso()});
  commit();return true;
}
/* Adds several new tasks at the top, in the order given. Nothing existing is touched; if that cannot be shown, nothing is added. */
function addMany(text,actId){
  if(actId&&!act(actId))return {error:true};
  var lines=text.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
  var have={};
  S.tasks.forEach(function(t){if((t.activityId||null)===(actId||null))have[t.text.trim().toLowerCase()]=1;});
  var fresh=[],skipped=0,now=iso();
  lines.forEach(function(x){
    var k=x.toLowerCase();
    if(have[k]){skipped++;return;}
    have[k]=1;
    fresh.push({id:uid(),text:x,activityId:actId||null,created:now,done:null,updated:now});
  });
  var before=JSON.stringify(S.tasks),n=S.tasks.length;
  S.tasks=fresh.concat(S.tasks);
  if(S.tasks.length!==n+fresh.length||JSON.stringify(S.tasks.slice(fresh.length))!==before){S.tasks=JSON.parse(before);return {error:true};}
  if(fresh.length)commit();
  return {added:fresh.length,skipped:skipped};
}
function toggle(id){
  var t=task(id);if(!t)return;
  if(t.done){t.done=null;if(ui.lastTicked===id)ui.lastTicked=null;}
  else{t.done=iso();ui.lastTicked=id;}
  t.updated=iso();
  commit();
}
function restore(id){var t=task(id);if(t){t.done=null;t.updated=iso();}ui.lastTicked=null;commit();}
function createActivity(name){
  name=(name||'').trim();if(!name)return null;
  var a={id:uid(),name:name,created:iso(),archived:null,updated:iso()};
  S.activities.push(a);return a;
}
function openActivity(id){ui.view='activity';ui.activityId=id;ui.lastActivityId=id;ui.sheet=null;render();}
function go(view){ui.view=view;ui.sheet=null;render();}
function archiveActivity(id){
  var a=act(id);if(!a)return;
  a.archived=iso();a.updated=iso();
  if(ui.lastActivityId===id)ui.lastActivityId=null;
  ui.view='activities';commit();
}
function unarchive(id){var a=act(id);if(a){a.archived=null;a.updated=iso();}commit();}
function closeSheet(){ui.sheet=null;ui.afterCreate=null;render();}

/* ---------- views ---------- */
var app=document.getElementById('app');

function lastAct(){
  var a=act(ui.lastActivityId);
  if(a&&!a.archived)return a;
  var l=live();return l.length?l[l.length-1]:null;
}

function topbar(){
  var onMaster=ui.view==='master';
  var a=onMaster?lastAct():act(ui.activityId);
  var kids=[h('button',{class:'btn'+(onMaster?' on':''),onclick:function(){go('master');}},['Master tasks'])];
  if(a){
    var tab=h('button',{class:'btn tab'+(onMaster?'':' on'),'aria-label':onMaster?'Open activity: '+a.name:'Switch activity: '+a.name,
      onclick:function(){if(onMaster)openActivity(a.id);else{ui.sheet={type:'switch'};render();}}},
      [h('span',{text:a.name}),svg(ICON.down,18)]);
    kids.push(tab);
  }else{
    kids.push(h('button',{class:'btn tab',onclick:function(){go('activities');}},[h('span',{text:'Activities'}),svg(ICON.right,18)]));
  }
  kids.push(h('button',{class:'btn icon','aria-label':'New activity',onclick:function(){ui.afterCreate='open';ui.sheet={type:'new'};render();}},[svg(ICON.plus)]));
  return h('div',{class:'topbar'},kids);
}

function dots(cur){
  var a=lastAct();
  function b(i,label,fn){return h('button',{'aria-current':i===cur?'page':null,onclick:fn},[h('span',{text:label})]);}
  return h('nav',{class:'nav','aria-label':'Pages'},[
    b(0,'Archive',function(){go('archive');}),
    b(1,'Activities',function(){go('activities');}),
    b(2,'Master tasks',function(){go('master');}),
    b(3,a?a.name:'Activity',function(){
      if(!a){go('activities');}
      else if(ui.view==='activity'){ui.sheet={type:'switch'};render();}
      else openActivity(a.id);})
  ]);
}

/* turns web addresses and phone numbers in a note into tappable links; everything else stays plain text */
function richText(str){
  var out=[],re=/(https?:\/\/[^\s<>]+|www\.[^\s<>]+)|(\+?\d[\d ().-]{7,}\d)/gi,last=0,m;
  while((m=re.exec(str))){
    if(m.index>last)out.push(str.slice(last,m.index));
    var s=m[0];
    if(m[1]){
      var tr=s.match(/[.,;:!?)\]'"”’]+$/);
      if(tr){s=s.slice(0,-tr[0].length);re.lastIndex=m.index+s.length;}
      out.push(h('a',{href:/^www\./i.test(s)?'https://'+s:s,target:'_blank',rel:'noopener noreferrer',text:s}));
    }else{
      var d=s.replace(/\D/g,'');
      if(d.length>=9&&d.length<=15)out.push(h('a',{href:'tel:'+(s.charAt(0)==='+'?'+':'')+d,text:s}));
      else out.push(s);
    }
    last=re.lastIndex;
  }
  if(last<str.length)out.push(str.slice(last));
  return out;
}

function taskRow(t,showAct){
  var a=t.activityId?act(t.activityId):null;
  var sub=showAct&&a?h('small',{text:a.name}):null;
  var hasNotes=!!(t.notes&&t.notes.trim()),isOpen=hasNotes&&!!ui.open[t.id];
  return h('div',{class:'row'+(t.done?' done':''),'data-id':t.id},[
    h('button',{class:'tick','aria-label':(t.done?'Untick: ':'Tick: ')+t.text,onclick:function(){toggle(t.id);}},[tickIcon(!!t.done)]),
    h('button',{class:'rowtext','aria-label':'Edit task: '+t.text,onclick:function(){ui.editId=t.id;ui.sheet={type:'edit'};render();}},[

var SCOPE='https://www.googleapis.com/auth/tasks';
var TB='https://tasks.googleapis.com/tasks/v1/';
var SYNC_DEFAULTS={listId:'',listName:'',enabled:false,confirmed:false,auto:true,interval:5,dir:'both',ticks:true,adds:true,edits:true,deletes:'ask',last:null};
/* G is runtime only (never saved): token, status and the latest plan. Settings live in S.sync. */
var G={token:null,exp:0,status:'idle',err:'',lists:[],busy:false,plan:null,pending:null,running:false,again:false};
var enc=encodeURIComponent;
function cfg(){
  if(!S.sync)S.sync={};
  for(var k in SYNC_DEFAULTS)if(S.sync[k]===undefined)S.sync[k]=SYNC_DEFAULTS[k];
  if(!Array.isArray(S.deleted))S.deleted=[];

function ago(d){
  if(!d)return 'never';
  var s=Math.max(0,Math.round((Date.now()-new Date(d).getTime())/1000));
  if(s<45)return 'just now';
  var m=Math.round(s/60);if(m<60)return m+(m===1?' minute':' minutes')+' ago';
  var hr=Math.round(m/60);if(hr<24)return hr+(hr===1?' hour':' hours')+' ago';
  var dd=Math.round(hr/24);return dd+(dd===1?' day':' days')+' ago';
}
/* a redraw that never touches a text box someone may be typing in: the add or search box stays put and
   everything around it is swapped; with a sheet open, or while dragging, it waits until that is finished */
function softRender(){
  var ae=document.activeElement;
  if(ui.dragging||ui.sheet){ui.dirty=true;return;}
  if(ae&&app.contains(ae)&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')){
    var keep=ae.closest('.addwrap');
    if(keep&&keep.parentNode===app&&patchAround(keep))return;
    ui.dirty=true;return;
  }

}
function patchAround(keep){
  var kids=viewKids(),idx=-1;
  kids.forEach(function(k,i){if(k.classList&&k.classList.contains('addwrap'))idx=i;});
  if(idx<0)return false;
  var sc=app.querySelector('.list'),st=sc?sc.scrollTop:0;
  while(keep.previousSibling)app.removeChild(keep.previousSibling);
  while(keep.nextSibling)app.removeChild(keep.nextSibling);
  kids.slice(0,idx).forEach(function(k){app.insertBefore(k,keep);});
  kids.slice(idx+1).forEach(function(k){app.appendChild(k);});
  var l=app.querySelector('.list');if(l)l.scrollTop=st;
  ui.dirty=false;
  return true;
}
function commitSync(){commit(true);}

/* sign-in: a quiet request first (prompt none); a tap is needed if Google wants to show something */
function needScopes(extra){
  var c=cfg(),d=dcfg(),a=[];
  if(c.enabled&&c.listId)a.push(SCOPE);
  if(d.enabled)a.push(DRIVE);
  (extra||[]).forEach(function(x){if(a.indexOf(x)<0)a.push(x);});
  return a;
}
function tokenValid(need){return !!G.token&&Date.now()<G.exp-60000&&(need||[]).every(function(x){return (G.tokScope||[]).indexOf(x)>-1;});}
var silentFailAt=0,askingUntil=0,pendingTok=null;
function getToken(interactive,extra){
  var need=needScopes(extra);
  if(tokenValid(need))return Promise.resolve(G.token);
  /* a quiet attempt that failed is not repeated for ten minutes: Google needs a tap, and retrying only makes the screen flash */
  if(!interactive&&Date.now()-silentFailAt<600000)return Promise.reject({type:'quiet'});
  if(!interactive&&pendingTok)return pendingTok;
  var pr=new Promise(function(res,rej){
    var cid=getCid();
    if(!cid){rej({type:'noclient'});return;}
    function fail(t){if(!interactive)silentFailAt=Date.now();rej({type:t});}
    function start(){
      try{
        var tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:need.join(' '),
          callback:function(r){
            if(r&&r.access_token){silentFailAt=0;G.token=r.access_token;G.tokScope=need;G.exp=Date.now()+(r.expires_in||3600)*1000;res(G.token);}
            else fail((r&&r.error)||'denied');
          },
          error_callback:function(e){fail((e&&e.type)||'blocked');}});
        /* Google's window opening and closing makes the page lose and regain focus; ignore that for a few seconds */
        askingUntil=Date.now()+6000;
        tc.requestAccessToken({prompt:interactive?'':'none'});
      }catch(e){fail('start');}
    }
    if(gisReady&&window.google&&google.accounts){start();return;}
    loadGIS();
    var n=0,iv=setInterval(function(){
      if(gisReady&&window.google&&google.accounts){clearInterval(iv);start();}
      else if(++n>40){clearInterval(iv);fail('load');}
    },250);
  });
  var clear=function(){if(pendingTok===pr)pendingTok=null;};
  pr.then(clear,clear);
  if(!interactive)pendingTok=pr;

}
function gcall(method,url,body){
  var o={method:method,headers:{Authorization:'Bearer '+G.token}};
  if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
  return fetch(url,o).then(function(r){
    if(r.status===401){G.token=null;var e=new Error('Your Google sign-in has expired.');e.auth=true;throw e;}
    if(r.status===404&&method==='DELETE')return null;
    if(!r.ok){var e2=new Error('Google said '+r.status+(r.status===403?'. Check that the Google Tasks API is switched on and that you approved the permission to change tasks.':'.'));throw e2;}
    return r.status===204?null:r.json();

function fetchAll(listId){
  var all=[];

    var u=TB+'lists/'+enc(listId)+'/tasks?showCompleted=true&showHidden=true&maxResults=100'+(tok?'&pageToken='+enc(tok):'');
    return gcall('GET',u).then(function(d){all=all.concat(d.items||[]);return d.nextPageToken?page(d.nextPageToken):all;});
  }

}

/* how a task looks in Google: its text is the title; the notes start with an "Activity:" line, then the details */
function composeNotes(t){
  var a=t.activityId?act(t.activityId):null,d=(t.notes||'').trim(),p=[];
  if(a)p.push('Activity: '+a.name);
  if(d)p.push(d);

}
function parseNotes(n){
  n=(n||'').replace(/\r\n/g,'\n');
  var m=n.match(/^Activity: ([^\n]*)(?:\n\n?|$)/);
  if(m)return {activity:m[1].trim(),details:n.slice(m[0].length).trim()};
  return {activity:null,details:n.trim()};
}
function appRepr(t){return {title:t.text,notes:composeNotes(t),done:!!t.done};}
function gRepr(g){return {title:(g.title||'').trim(),notes:(g.notes||'').replace(/\r\n/g,'\n').trim(),done:g.status==='completed'};}
function findAct(name){
  var n=name.toLowerCase();
  function same(a){return a.name.toLowerCase()===n;}
  return live().filter(same)[0]||archived().filter(same)[0]||null;
}
function linkOf(t,pre){
  if(t.sid&&t.sid.indexOf(pre)===0)return t.sid.slice(pre.length);
  if(t.gid&&t.gid.indexOf(pre)===0)return t.gid.slice(pre.length);
  return null;
}
function applyPull(t,g,f){
  if(f==='title'){var v=(g.title||'').trim();if(v)t.text=v;}
  else if(f==='notes'){
    var p=parseNotes(g.notes);
    if(p.details)t.notes=p.details;else delete t.notes;
    if(p.activity){var a=findAct(p.activity);if(a)t.activityId=a.id;}
  }else if(f==='done'){t.done=g.status==='completed'?(g.completed||iso()):null;}
}

/* work out what a sync would do, without doing it */
function buildPlan(gtasks){
  var c=cfg(),L=c.listId,pre=L+':',toG=c.dir!=='toApp',toA=c.dir!=='toGoogle';
  var gmap={},seen={},tomb={},recreate=[];
  gtasks.forEach(function(g){gmap[g.id]=g;});
  S.deleted.forEach(function(d){if(d.gid.indexOf(pre)===0)tomb[d.gid.slice(pre.length)]=d;});
  var P={merge:[],ins:[],news:[],del:{app:[],google:[]},n:{gNew:0,gEdit:0,aNew:0,aEdit:0},linked:0,stopped:false};

  S.tasks.forEach(function(t){
    var id=linkOf(t,pre);if(!id)return;
    P.linked++;
    var g=gmap[id];
    if(!g){
      if(t.done)return;
      if(c.deletes==='never'||!toA)recreate.push(t);
      else P.del.app.push(t);
      return;
    }
    seen[id]=1;
    var gr=gRepr(g),ar=appRepr(t),base=t.gs?{title:t.gs.title,notes:t.gs.notes,done:t.gs.done}:{title:gr.title,notes:gr.notes,done:gr.done};
    var gUpd=Date.parse(g.updated)||0,aUpd=Date.parse(t.updated)||0;
    var nb={title:base.title,notes:base.notes,done:base.done},patch={},pulls=[],pushed=[];
    ['title','notes','done'].forEach(function(f){
      var allowed=f==='done'?c.ticks:c.edits;
      var aC=ar[f]!==base[f],gC=gr[f]!==base[f],dec=null;
      if(aC&&gC&&ar[f]!==gr[f])dec=aUpd>gUpd?'app':'google';
      else if(aC&&!gC)dec='app';
      else if(gC&&!aC)dec='google';
      if(allowed&&dec==='app'&&toG){pushed.push(f);}
      else if(allowed&&dec==='google'&&toA){pulls.push(f);nb[f]=gr[f];}
      else if(ar[f]===gr[f]){nb[f]=ar[f];}
    });
    var tmp={title:t.text,activityId:t.activityId,notes:t.notes,done:t.done};
    pulls.forEach(function(f){applyPullTo(tmp,g,f);});
    /* after pulling notes, the app's own wording of them may differ from Google's: send that back too */
    if(pulls.indexOf('notes')>-1&&toG&&composeNotes(tmp)!==gr.notes&&pushed.indexOf('notes')<0)pushed.push('notes');
    if(pushed.length)P.n.gEdit++;
    if(pulls.length)P.n.aEdit++;
    if(!pushed.length&&!pulls.length&&t.gs&&t.sid===pre+id&&nb.title===t.gs.title&&nb.notes===t.gs.notes&&nb.done===t.gs.done)return;
    P.merge.push(function(){
      pulls.forEach(function(f){applyPull(t,g,f);});
      if(pulls.length)t.updated=g.updated;
      var fin=appRepr(t);
      pushed.forEach(function(f){
        if(f==='title')patch.title=fin.title;
        else if(f==='notes')patch.notes=fin.notes||null;
        else{patch.status=fin.done?'completed':'needsAction';if(!fin.done)patch.completed=null;}
      });
      function finish(r){
        var out=r?gRepr(r):null;
        pushed.forEach(function(f){nb[f]=out?out[f]:fin[f];});
        t.gs={title:nb.title,notes:nb.notes,done:nb.done};t.sid=pre+id;
      }
      if(!pushed.length){finish(null);return Promise.resolve();}
      return gcall('PATCH',TB+'lists/'+enc(L)+'/tasks/'+enc(id),patch).then(finish);
    });
  });

  /* tasks only in the app go up to Google (oldest first, so the newest ends up on top) */
  var ins=[];
  if(toG){
    S.tasks.forEach(function(t){
      if(t.done)return;
      var id=linkOf(t,pre);
      if(id&&gmap[id])return;
      if(id){if(recreate.indexOf(t)>-1)ins.push(t);return;}

  }
  ins.slice().reverse().forEach(function(t){
    P.ins.push(function(){
      var body={title:t.text};
      var nt=composeNotes(t);if(nt)body.notes=nt;

  var news=[];
  gtasks.forEach(function(g){
    if(seen[g.id])return;
    var tb=tomb[g.id];
    if(tb&&c.deletes!=='never'){if(toG)P.del.google.push(tb);return;}
    if(!toA||!c.adds)return;

  return P;
}
/* same as applyPull but onto a plain copy, used only to preview the wording */
function applyPullTo(tmp,g,f){
  if(f==='notes'){
    var p=parseNotes(g.notes);

function runSeq(fns){return fns.reduce(function(p,f){return p.then(f);},Promise.resolve());}

function applyPlan(P,opts){
  var c=cfg(),L=c.listId,pre=L+':',force=!!(opts&&opts.force);
  var park=!force&&(c.deletes==='ask'||P.stopped);
  var hasDel=P.del.app.length+P.del.google.length>0;
  var fns=P.merge.slice();
  G.pending=null;
  if(hasDel&&park)G.pending={app:P.del.app.length,google:P.del.google.length,stopped:P.stopped};
  if(hasDel&&!park){
    P.del.google.forEach(function(d){fns.push(function(){return gcall('DELETE',TB+'lists/'+enc(L)+'/tasks/'+enc(d.gid.slice(pre.length)));});});
  }
  fns=fns.concat(P.ins);
  if(!c.confirmed){try{localStorage.setItem('tasks.v1.presync',JSON.stringify(S));}catch(e){}c.confirmed=true;}
  return runSeq(fns).then(function(){
    if(P.news.length){
      var made=P.news.map(function(g){
        var gr=gRepr(g),p=parseNotes(gr.notes),a=p.activity?findAct(p.activity):null;
        var t={id:uid(),text:gr.title,activityId:a?a.id:null,created:g.updated||iso(),done:null,sid:pre+g.id,gs:gr,updated:g.updated};
        if(p.details)t.notes=p.details;

      var gone={};P.del.app.forEach(function(t){gone[t.id]=1;S.gone.push({id:t.id,at:iso()});});
      S.tasks=S.tasks.filter(function(t){if(gone[t.id]){delete ui.open[t.id];if(ui.lastTicked===t.id)ui.lastTicked=null;return false;}return true;});
    }
    var keep={};
    if(park)P.del.google.forEach(function(d){keep[d.gid]=1;});

function syncNow(reason,opts){
  opts=opts||{};
  var c=cfg();
  if(!c.listId)return Promise.resolve();
  if(G.running){G.again=true;return Promise.resolve();}
  if(!opts.interactive&&(reason==='change'||reason==='timer')&&G.status==='needs'&&!tokenValid(needScopes([SCOPE])))return Promise.resolve();
  G.running=true;G.err='';
  if(G.status!=='confirm')G.status='syncing';
  if(ui.view==='sync')softRender();
  return getToken(!!opts.interactive,[SCOPE]).then(function(){
    return fetchAll(c.listId);
  }).then(function(gt){
    var P=buildPlan(gt);G.plan=P;
    if(!c.confirmed&&!opts.confirm){G.status='confirm';return null;}
    return applyPlan(P,opts).then(function(){G.status='idle';});
  }).catch(function(e){
    if(e&&e.type==='noclient'){G.status='error';G.err='Add your Google client ID on the Import page first.';}
    else if(e&&(e.auth||(e.type&&!opts.interactive))){G.status='needs';G.err='';}
    else if(e&&e.type){G.status='error';G.err='Google did not give access ('+e.type+').';}
    else if(e instanceof TypeError){G.status='error';G.err='Could not reach Google. It will try again.';}
    else{G.status='error';G.err=(e&&e.message)||'Sync failed.';}

    G.running=false;

function startFirstSync(){G.status='syncing';syncNow('manual',{confirm:true,interactive:true});}

function keepPending(){

  P.del.app.forEach(function(t){delete t.sid;delete t.gs;if(t.gid&&t.gid.indexOf(pre)===0)delete t.gid;});
  var gone={};P.del.google.forEach(function(d){gone[d.gid]=1;});
  S.deleted=S.deleted.filter(function(d){return !gone[d.gid];});

  commitSync();
  syncNow('manual',{interactive:true});

function disconnectSync(){

function applyMerged(doc){

/* Drive transport */
function dfetch(method,url,headers,body){
  var o={method:method,headers:Object.assign({Authorization:'Bearer '+G.token},headers||{})};
  if(body!==undefined)o.body=body;
  return fetch(url,o).then(function(r){
    if(r.status===401){G.token=null;var e=new Error('Your Google sign-in has expired.');e.auth=true;throw e;}
    if(!r.ok)throw new Error('Google Drive said '+r.status+(r.status===403?'. Check that the Google Drive API is switched on and that you approved the Drive permission.':'.'));
    return r;
  });
}
function dfind(){
  return dfetch('GET',DB+'files?spaces=appDataFolder&q='+enc("name='"+DFILE+"' and trashed=false")+'&fields='+enc('files(id,version)'))
    .then(function(r){return r.json();}).then(function(d){return (d.files&&d.files[0])||null;});
}
function dread(id){
  return dfetch('GET',DB+'files/'+enc(id)+'?alt=media').then(function(r){return r.text();}).then(function(t){
    var d;try{d=JSON.parse(t);}catch(e){throw new Error('The data saved in Google Drive could not be read.');}
    if(!d||!Array.isArray(d.activities)||!Array.isArray(d.tasks))throw new Error('The data saved in Google Drive is not in the expected format.');
    if(d.v>2)throw new Error('The data in Google Drive was written by a newer version of the app. Reload the app to update it.');
    return d;
  });
}
function dversion(id){return dfetch('GET',DB+'files/'+enc(id)+'?fields=version').then(function(r){return r.json();}).then(function(d){return d.version;});}
function dcreate(doc){
  var bd='gag'+Date.now();
  var body='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:DFILE,parents:['appDataFolder']})+
    '\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(doc)+'\r\n--'+bd+'--';
  return dfetch('POST',DU+'files?uploadType=multipart&fields=id,version',{'Content-Type':'multipart/related; boundary='+bd},body);
}
function dupdate(id,doc){
  return dfetch('PATCH',DU+'files/'+enc(id)+'?uploadType=media&fields=id,version',{'Content-Type':'application/json'},JSON.stringify(doc));
}
/* read, merge, save. If someone else saved in between, start again (up to three times). */
function driveCycle(n){
  return dfind().then(function(f){

    return dread(f.id).then(function(remote){
      var merged=mergeDocs(toDoc(S),remote);
      D.seen={fileId:f.id,a:remote.activities.length,t:remote.tasks.length};
      applyMerged(merged);
      if(stable(merged)===stable(remote))return null;
      return dversion(f.id).then(function(v){

function driveNow(reason,opts){

      var n=createActivity(v);if(!n)return;
      var mode=ui.afterCreate;ui.afterCreate=null;ui.sheet=null;
      if(mode&&mode.assign){var I=impState();if(mode.assign==='bulk'){I.bulk=n.id;I.items.forEach(function(it){if(!it.dup)it.act=n.id;});}else{I.items.forEach(function(it){if(it.gid===mode.assign)it.act=n.id;});}saveDraft();commit();}
      else if(mode==='pick'){ui.pick=n.id;commit();}
      else if(mode==='stay'){commit();}
      else{ui.view='activity';ui.activityId=n.id;ui.lastActivityId=n.id;commit();}
    }
    inner.push(h('h2',{text:renaming?'Rename activity':'New activity'}));
    inner.push(h('div',{class:'field'},[inp,h('div',{class:'btns'},[
      h('button',{class:'btn',onclick:closeSheet},['Cancel']),
      h('button',{class:'btn primary',onclick:save},[renaming?'Save':'Create'])])]));
  }else if(s.type==='edit'){
    var t=task(ui.editId);if(!t)return null;
    var ti=h('input',{type:'text',id:'sheetin','aria-label':'Task text',value:t.text,autocomplete:'off',
      onkeydown:function(e){if(e.key==='Enter'){e.preventDefault();saveEdit();}}});
    var sel=h('select',{'aria-label':'Activity'},[h('option',{value:'',text:'No activity'})].concat(
      S.activities.filter(function(a){return !a.archived||a.id===t.activityId;}).map(function(a){return h('option',{value:a.id,text:a.name+(a.archived?' (archived)':'')});})));
    sel.value=t.activityId||'';
    var hasN=!!(t.notes&&t.notes.trim());
    var nt=h('textarea',{id:'sheetnotes','aria-label':'Details',placeholder:'A web address, a phone number, anything useful',autocapitalize:'sentences'});
    nt.value=t.notes||'';
    var notesBox=h('label',null,['Details',nt]);
    var addN=h('button',{class:'btn',type:'button',onclick:function(){addN.replaceWith(notesBox);nt.focus();}},['Add details']);
    function saveEdit(){
      var v=ti.value.trim();if(!v)return;
      t.text=v;t.activityId=sel.value||null;t.updated=iso();
      var nv=(hasN||notesBox.parentNode)?nt.value.trim():'';
      if(nv)t.notes=nv;else delete t.notes;
      if(!nv)delete ui.open[t.id];
      ui.sheet=null;commit();
    }
    inner.push(h('h2',{text:'Edit task'}));
    inner.push(h('div',{class:'field'},[ti,h('label',null,['Activity',sel]),hasN?notesBox:addN,
      h('div',{class:'btns'},[
        h('button',{class:'btn danger',onclick:function(){
          [t.sid,t.gid].forEach(function(l){if(l)S.deleted.push({gid:l,text:t.text,at:iso()});});
          S.gone.push({id:t.id,at:iso()});
          S.tasks=S.tasks.filter(function(x){return x.id!==t.id;});delete ui.open[t.id];if(ui.lastTicked===t.id)ui.lastTicked=null;ui.sheet=null;commit();}},['Delete']),
        h('button',{class:'btn',onclick:closeSheet},['Cancel']),
        h('button',{class:'btn primary',onclick:saveEdit},['Save'])])]));
  }
  return h('div',null,[h('div',{class:'scrim',onclick:closeSheet}),h('div',{class:'sheet',role:'dialog','aria-modal':'true'},inner)]);
}

/* ---------- render ---------- */
function viewKids(){
  return [h('p',{class:'brand',text:'Get a grip'})].concat(viewBody());
}
function viewBody(){
  return ui.view==='activity'?viewActivity():ui.view==='activities'?viewActivities():ui.view==='archive'?viewArchive():ui.view==='import'?viewImport():ui.view==='sync'?viewSync():viewMaster();
}
function render(){
  ui.dirty=false;
  var kids=viewKids();
  var scroller=app.querySelector('.list');var st=scroller?scroller.scrollTop:0;
  var ae=document.activeElement,keep=null;
  if(ae&&app.contains(ae)&&ae.tagName==='INPUT'&&ae.type==='text'){keep={id:ae.id,label:ae.getAttribute('aria-label'),s:ae.selectionStart,e:ae.selectionEnd};}
  app.replaceChildren.apply(app,kids.concat([sheetEl()].filter(Boolean)));
  var l=app.querySelector('.list');if(l&&ui.view===lastView)l.scrollTop=st;
  lastView=ui.view;
  if(keep&&!ui.sheet){
    var q=keep.id?document.getElementById(keep.id):null;
    if(!q&&keep.label){var all=app.querySelectorAll('input[type=text]');for(var i=0;i<all.length;i++){if(all[i].getAttribute('aria-label')===keep.label){q=all[i];break;}}}
    if(q&&q!==document.activeElement){try{q.focus({preventScroll:true});q.setSelectionRange(keep.s,keep.e);}catch(x){}}
  }
  if(ui.focusHandle){var fh=app.querySelector('[data-handle="'+ui.focusHandle+'"]');if(fh)fh.focus();ui.focusHandle=null;}
  if(ui.sheet&&ui.sheet.type==='bulk'&&!ui.sheet.msg){var bi=document.getElementById('bulkin');if(bi)bi.focus();}
  if(ui.sheet&&(ui.sheet.type==='new'||ui.sheet.type==='rename'||ui.sheet.type==='edit')){
    var si=document.getElementById('sheetin');if(si){si.focus();si.select();}
  }
}
var lastView='';

/* drag to reorder */
function applyOrder(ids){
  var set={},byId={},slots=[];
  ids.forEach(function(i){set[i]=1;});
  S.tasks.forEach(function(t,i){byId[t.id]=t;if(set[t.id])slots.push(i);});
  slots.forEach(function(si,k){S.tasks[si]=byId[ids[k]];});
  cfg();S.ord.t=iso();
}
function applyActOrder(ids){
  var set={},byId={},slots=[];
  ids.forEach(function(i){set[i]=1;});
  S.activities.forEach(function(a,i){byId[a.id]=a;if(set[a.id])slots.push(i);});
  slots.forEach(function(si,k){S.activities[si]=byId[ids[k]];});
  cfg();S.ord.a=iso();
}
function rowIds(list,sel){return Array.prototype.slice.call(list.querySelectorAll(sel||'.row')).map(function(r){return r.getAttribute('data-id');});}
function scrollerOf(el){var n=el.parentNode;while(n&&n!==document.body){var o=getComputedStyle(n).overflowY;if(o==='auto'||o==='scroll')return n;n=n.parentNode;}return el.parentNode;}
function startDrag(e,id,sel,apply){
  sel=sel||'.row';apply=apply||applyOrder;
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();
  var handle=e.currentTarget,row=handle.closest(sel),list=row.parentNode,scroller=scrollerOf(row);
  var before=rowIds(list,sel).join(','),grab=e.clientY-row.getBoundingClientRect().top;
  var lastY=e.clientY,raf=0,active=true;
  row.classList.add('dragging');ui.dragging=true;
  try{handle.setPointerCapture(e.pointerId);}catch(x){}
  function place(){
    row.style.transform='none';
    var rows=Array.prototype.slice.call(list.querySelectorAll(sel)).filter(function(r){return r!==row;});
    var target=null;
    for(var i=0;i<rows.length;i++){var r=rows[i].getBoundingClientRect();if(lastY<r.top+r.height/2){target=rows[i];break;}}
    if(target)list.insertBefore(row,target);else list.appendChild(row);
    var nat=row.getBoundingClientRect().top;
    row.style.transform='translateY('+(lastY-grab-nat)+'px)';
  }
  function loop(){
    if(!active)return;
    var lr=scroller.getBoundingClientRect();
    if(lastY<lr.top+48)scroller.scrollTop-=10;else if(lastY>lr.bottom-48)scroller.scrollTop+=10;
    place();raf=requestAnimationFrame(loop);
  }
  function move(ev){lastY=ev.clientY;}
  function end(){
    active=false;ui.dragging=false;cancelAnimationFrame(raf);
    handle.removeEventListener('pointermove',move);
    handle.removeEventListener('pointerup',end);
    handle.removeEventListener('pointercancel',end);
    var ids=rowIds(list,sel);
    if(ids.join(',')===before){render();return;}
    apply(ids);commit();
  }
  handle.addEventListener('pointermove',move);
  handle.addEventListener('pointerup',end);
  handle.addEventListener('pointercancel',end);
  loop();
}
function nudge(e,id,sel,apply){
  sel=sel||'.row';apply=apply||applyOrder;
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;
  e.preventDefault();
  var list=e.currentTarget.closest(sel).parentNode,ids=rowIds(list,sel),i=ids.indexOf(id),j=i+(e.key==='ArrowUp'?-1:1);
  if(i<0||j<0||j>=ids.length)return;
  ids.splice(i,1);ids.splice(j,0,id);
  apply(ids);ui.focusHandle=id;commit();
}

/* swipe between pages: Archive | Activities | Master tasks | Activity */
var tx=0,ty=0,tracking=false;
document.addEventListener('touchstart',function(e){
  if(ui.sheet||e.touches.length!==1){tracking=false;return;}
  var tg=e.target;if(tg.closest&&tg.closest('input,select,textarea,.handle'))return;
  tracking=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!tracking)return;tracking=false;
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
  var left=dx<0;
  if(ui.view==='master'){
    if(left){var a=lastAct();if(a)openActivity(a.id);}else go('activities');
  }else if(ui.view==='activity'&&!left){go('master');}
  else if(ui.view==='activities'){if(left)go('master');else go('archive');}
  else if(ui.view==='archive'&&left){go('activities');}
},{passive:true});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet();});

render();
(function(){
  var c=cfg(),d=dcfg();
  if((c.enabled&&c.listId)||d.enabled){
    if(getCid())loadGIS();
    if(c.auto&&anySync())setTimeout(function(){syncAll('open');},800);
  }
  function lastAny(){var k=cfg(),dd=dcfg();return Math.max(k.last?Date.parse(k.last):0,dd.last?Date.parse(dd.last):0);}
  setInterval(function(){
    var k=cfg();
    if(!k.auto||!anySync()||!k.interval||document.visibilityState!=='visible')return;
    if(Date.now()-lastAny()>=k.interval*60000-5000)syncAll('timer');
  },30000);
  document.addEventListener('visibilitychange',function(){
    var k=cfg();
    if(document.visibilityState!=='visible'||!k.auto||!anySync())return;
    if(Date.now()<askingUntil||G.running||D.running)return;
    if(Date.now()-lastAny()>30000)syncAll('return');
  });
  document.addEventListener('focusout',function(){
    if(ui.dirty)setTimeout(function(){if(ui.dirty)softRender();},250);
  });
})();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
